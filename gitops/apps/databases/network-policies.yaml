apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: databases-network-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: default
  source:
    repoURL: https://github.com/cristsr/homelab
    targetRevision: HEAD
    path: platform/databases
    directory:
      recurse: true
      include: "network-policy.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: databases
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
