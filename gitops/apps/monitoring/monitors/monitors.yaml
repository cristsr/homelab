apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitors
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    argocd.argoproj.io/sync-description: "ServiceMonitor CRs for prometheus"
spec:
  project: default
  source:
    repoURL: https://github.com/cristsr/homelab
    targetRevision: HEAD
    path: platform/monitoring/service-monitors
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
