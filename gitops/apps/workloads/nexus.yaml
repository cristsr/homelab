apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # After kaneo (wave 9): it creates the namespace and the Service this app calls.
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: homelab
  source:
    repoURL: https://github.com/cristsr/homelab
    targetRevision: HEAD
    path: workloads/nexus
  destination:
    server: https://kubernetes.default.svc
    namespace: kaneo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
