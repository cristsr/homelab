apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: media
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  project: homelab
  source:
    repoURL: https://github.com/cristsr/homelab
    targetRevision: HEAD
    path: workloads/media
  destination:
    server: https://kubernetes.default.svc
    namespace: media
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - '.spec.parentRefs[].group'
        - '.spec.parentRefs[].kind'
        - '.spec.rules[].backendRefs[].group'
        - '.spec.rules[].backendRefs[].kind'
        - '.spec.rules[].backendRefs[].weight'
        - '.spec.rules[].matches'
    # The config claims were created by hand, so they never got the tracking
    # annotation. Adding it needs a replace, which a bound claim refuses.
    # Same for volumeName: the manifests omit it and a bound claim is immutable.
    - kind: PersistentVolumeClaim
      jsonPointers:
        - /spec/volumeName
      jqPathExpressions:
        - '.metadata.annotations["argocd.argoproj.io/tracking-id"]'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
      - RespectIgnoreDifferences=true
      # Replace turns every object of a sync into a full replace, and a bound
      # claim refuses it even when it is in sync. Apply only what drifted.
      - ApplyOutOfSyncOnly=true
