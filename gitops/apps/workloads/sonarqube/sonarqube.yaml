apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: homelab
  sources:
    - repoURL: https://SonarSource.github.io/helm-chart-sonarqube
      chart: sonarqube
      targetRevision: "2026.5.1003"
      helm:
        releaseName: sonarqube
        valueFiles:
          - $values/workloads/sonarqube/sonarqube.yaml
    - repoURL: https://github.com/cristsr/homelab
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sonarqube
  ignoreDifferences:
    # The chart stamps its version on this label, and a bound claim refuses
    # the replace that would update it. Nothing reads the label.
    - kind: PersistentVolumeClaim
      jqPathExpressions:
        - '.metadata.labels.chart'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
      # Replace turns every object of a sync into a full replace, and a bound
      # claim refuses it even when it is in sync. Apply only what drifted.
      - ApplyOutOfSyncOnly=true
