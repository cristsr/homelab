apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flow
  namespace: infra
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  project: default
  source:
    repoURL: https://github.com/cristsr/homelab
    targetRevision: HEAD
    path: platform/apps/flow
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  ignoreDifferences:
    - group: apisix.apache.org
      kind: ApisixRoute
      jqPathExpressions:
        - .spec.http[].backends[].namespace
        - .spec.http[].backends[].resolveGranularity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
