apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/cristsr/homelab
    targetRevision: HEAD
    path: platform/secret-management/openbao
    directory:
      exclude: "{openbao.yaml,init.yaml,rbac.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: secret-management
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
