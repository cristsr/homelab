apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apisix-config
  namespace: infra
  annotations:
    # Depende de APISIX running (wave 3)
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/cristsr/homelab
    targetRevision: HEAD
    path: platform/infra/apisix
    directory:
      recurse: true
      exclude: "values.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
