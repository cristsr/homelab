apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apisix
  namespace: infra
  annotations:
    # Requiere cert wildcard listo (wave 2) y Longhorn (wave 1)
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://charts.apiseven.com
      chart: apisix
      targetRevision: "2.9.0"
      helm:
        releaseName: apisix
        valueFiles:
          - $values/platform/infra/apisix/values.yaml
    - repoURL: https://github.com/cristsr/homelab
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /metadata/annotations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
