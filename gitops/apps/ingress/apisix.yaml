apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apisix
  namespace: argocd
  annotations:
    # Requiere cert wildcard listo (wave 2) y Longhorn (wave 1)
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: https://charts.apiseven.com
      chart: apisix
      targetRevision: "2.14.0"
      helm:
        releaseName: apisix
        valueFiles:
          - $values/platform/ingress/apisix/values.yaml
    - repoURL: https://github.com/cristsr/homelab
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
        - /spec/conversion
        - /spec/names/listKind
      jqPathExpressions:
        - '.spec.versions[].additionalPrinterColumns[]? | .priority'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
