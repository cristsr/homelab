apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apisix-config
  namespace: argocd
  annotations:
    # Depende de APISIX running (wave 3)
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/cristsr/homelab
    targetRevision: HEAD
    path: platform/ingress/apisix
    directory:
      recurse: true
      exclude: "values.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress
  ignoreDifferences:
    - group: apisix.apache.org
      kind: ApisixRoute
      jqPathExpressions:
        - .spec.http[].backends[].namespace
        - .spec.http[].backends[].resolveGranularity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
