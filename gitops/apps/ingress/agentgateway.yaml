apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentgateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  sources:
    - repoURL: oci://cr.agentgateway.dev/charts
      chart: agentgateway
      targetRevision: "1.1.0"
      helm:
        releaseName: agentgateway
        valueFiles:
          - $values/platform/ingress/agentgateway/values.yaml
    - repoURL: https://github.com/cristsr/homelab
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true