apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sonarqube-config
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: homelab
  source:
    repoURL: https://github.com/cristsr/homelab
    targetRevision: HEAD
    path: platform/devtools/sonarqube
    directory:
      exclude: "sonarqube.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: devtools
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jqPathExpressions:
        - '.spec.parentRefs[].group'
        - '.spec.parentRefs[].kind'
        - '.spec.rules[].backendRefs[].group'
        - '.spec.rules[].backendRefs[].kind'
        - '.spec.rules[].backendRefs[].weight'
        - '.spec.rules[].matches'
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - '.spec.data[].remoteRef.conversionStrategy'
        - '.spec.data[].remoteRef.decodingStrategy'
        - '.spec.data[].remoteRef.metadataPolicy'
        - '.spec.data[].remoteRef.nullBytePolicy'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
