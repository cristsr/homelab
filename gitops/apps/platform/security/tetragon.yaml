apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tetragon
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: homelab
  sources:
    - repoURL: https://helm.cilium.io
      targetRevision: 1.7.1
      chart: tetragon
      helm:
        releaseName: tetragon
        valueFiles:
          - $values/platform/security/tetragon/values.yaml
    - repoURL: https://github.com/cristsr/homelab
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/cristsr/homelab
      targetRevision: HEAD
      path: platform/security/tetragon/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: tetragon
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=false
      - Prune=true
