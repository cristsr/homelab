apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-init
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: homelab
  source:
    repoURL: https://github.com/cristsr/homelab
    targetRevision: HEAD
    path: platform/secret-management/openbao
    directory:
      exclude: "{openbao.yaml,httproute.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: secret-management
  ignoreDifferences:
    - group: ""
      kind: ServiceAccount
      jqPathExpressions:
        - '.automountServiceAccountToken'
  syncPolicy:
    automated:
      prune: true
      selfHeal: false