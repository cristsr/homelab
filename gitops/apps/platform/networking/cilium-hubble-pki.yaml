apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-hubble-pki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: homelab
  source:
    repoURL: https://github.com/cristsr/homelab
    targetRevision: HEAD
    path: platform/networking/hubble/pki
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
