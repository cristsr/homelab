apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: homelab
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api
    # Cilium 1.20 (ver bootstrap/helmfile.yaml y cilium-service-mesh.yaml)
    # requiere Gateway API v1.6.1 como minimo - ya no depende de TLSRoute
    # en v1alpha2 (servido por el canal standard en v1), a diferencia de
    # Cilium 1.19.x (cilium/cilium#38420, #44920, #45139).
    targetRevision: v1.6.1
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
