apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: homelab
  sources:
    - repoURL: https://helm.cilium.io
      # 1.20+ is required for compatibility with the Gateway API CRD version installed below.
      targetRevision: 1.20.2
      chart: cilium
      helm:
        releaseName: cilium
        valueFiles:
          - $values/bootstrap/cilium/values.yaml
          - $values/platform/networking/cilium/service-mesh-values.yaml
    - repoURL: https://github.com/cristsr/homelab
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/cristsr/homelab
      targetRevision: HEAD
      path: platform/networking/cilium
      directory:
        include: "namespace.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: cilium-ca
      namespace: kube-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-relay-client-certs
      namespace: kube-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-server-certs
      namespace: kube-system
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - Replace=false
      - Prune=true
