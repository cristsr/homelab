apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: homelab
  sources:
    - repoURL: https://helm.cilium.io
      # 1.19.3 requiere que el CRD TLSRoute este servido en v1alpha2 para
      # arrancar su reconciler de Gateway API, incompatible con Gateway API
      # v1.5+ que ya solo sirve v1 (cilium/cilium#44920, #45139). 1.20
      # mueve el soporte de Cilium a Gateway API v1.6.1 con TLSRoute en v1,
      # eliminando esa dependencia.
      targetRevision: 1.20.1
      chart: cilium
      helm:
        releaseName: cilium
        valueFiles:
          - $values/bootstrap/cilium/values.yaml
          - $values/platform/networking/cilium/service-mesh-values.yaml
    - repoURL: https://github.com/cristsr/homelab
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: cilium-ca
      namespace: kube-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-relay-client-certs
      namespace: kube-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-server-certs
      namespace: kube-system
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - Replace=false
      - Prune=true
