apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-description: "Prometheus Operator"
spec:
  project: homelab
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "83.7.0"
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/platform/observability/prometheus/prometheus.yaml
    - repoURL: https://github.com/cristsr/homelab
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/cristsr/homelab
      targetRevision: HEAD
      path: platform/observability
      directory:
        include: "namespace.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  # The chart renders Grafana's PVC without volumeName; once bound it's
  # immutable, so Replace=true fails on it.
  ignoreDifferences:
    - kind: PersistentVolumeClaim
      name: prometheus-grafana
      jsonPointers:
        - /spec/volumeName
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true
      - RespectIgnoreDifferences=true
