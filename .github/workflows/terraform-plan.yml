name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      # Needed to reach the Proxmox API on the homelab LAN via the subnet
      # route the hypervisor's Tailscale node advertises.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: hashicorp/setup-terraform@v3

      - name: Write R2 backend config
        run: |
          for dir in terraform/infra terraform/cluster; do
            cat > "$dir/backend.hcl" <<EOF
          endpoints = {
            s3 = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          EOF
          done

      - name: Terraform plan (infra)
        id: plan_infra
        working-directory: terraform/infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_proxmox_endpoint: ${{ vars.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
          TF_VAR_talos_schematic_id: ${{ vars.TALOS_SCHEMATIC_ID }}
          TF_VAR_vm_static_ip: ${{ vars.VM_STATIC_IP }}
          TF_VAR_vm_gateway: ${{ vars.VM_GATEWAY }}
        run: |
          terraform init -backend-config=backend.hcl
          terraform plan -no-color -input=false | tee ../../plan-infra.txt
          terraform output -raw kubeconfig_raw > ../cluster/generated-kubeconfig

      - name: Terraform plan (cluster)
        id: plan_cluster
        working-directory: terraform/cluster
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_kubeconfig_path: ${{ github.workspace }}/terraform/cluster/generated-kubeconfig
          TF_VAR_argocd_github_pat: ${{ secrets.ARGOCD_GITHUB_PAT }}
          TF_VAR_openbao_static_seal_key: ${{ secrets.OPENBAO_STATIC_SEAL_KEY }}
        run: |
          terraform init -backend-config=backend.hcl
          terraform plan -no-color -input=false | tee ../../plan-cluster.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const infra = fs.readFileSync('plan-infra.txt', 'utf8').slice(0, 60000);
            const cluster = fs.readFileSync('plan-cluster.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `#### Terraform Plan - infra\n<details><summary>Ver plan</summary>\n\n\`\`\`\n${infra}\n\`\`\`\n\n</details>\n\n#### Terraform Plan - cluster\n<details><summary>Ver plan</summary>\n\n\`\`\`\n${cluster}\n\`\`\`\n\n</details>`
            });
