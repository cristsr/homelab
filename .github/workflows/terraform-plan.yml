name: Terraform Plan

on:
  pull_request:
    paths:
      - "terraform/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Write CI SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOMESERVER_SSH_PRIVATE_KEY }}" > ~/.ssh/ci_ed25519
          chmod 600 ~/.ssh/ci_ed25519

      - uses: hashicorp/setup-terraform@v3

      - name: Write R2 backend config
        working-directory: terraform
        run: |
          cat > backend.hcl <<EOF
          endpoints = {
            s3 = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          EOF

      - name: Terraform init
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -backend-config=backend.hcl

      - name: Terraform plan
        id: plan
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_hypervisor_ssh_host: ${{ vars.HYPERVISOR_TAILSCALE_IP }}
          TF_VAR_hypervisor_ssh_user: ${{ vars.HYPERVISOR_SSH_USER }}
          TF_VAR_hypervisor_ssh_keyfile: /home/runner/.ssh/ci_ed25519
          TF_VAR_fedora_cloud_image_url: ${{ vars.FEDORA_CLOUD_IMAGE_URL }}
        run: |
          terraform plan -no-color -input=false | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `#### Terraform Plan\n<details><summary>Ver plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`
            });
