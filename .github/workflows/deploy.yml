name: Deploy

on:
  push:
    branches: [master]
    paths:
      - "terraform/**"
      - "ansible/**"
  workflow_dispatch: {}

concurrency:
  group: homelab-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision-and-configure:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for Ansible
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible

      - name: Write vault password
        run: |
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ansible/.vault-pass
          chmod 600 ansible/.vault-pass

      # Falla en segundos si falta o es invalida una credencial, antes de
      # gastar tiempo conectando Tailscale y aprovisionando la VM.
      - name: Preflight - validate secrets
        working-directory: ansible
        run: ansible-playbook preflight.yaml

      # Necesario porque Proxmox y la VM Talos viven en la LAN del homelab
      # (192.168.80.0/24), no publicamente alcanzable - el runner hosted
      # llega vía la ruta de subred que el nodo Tailscale del hipervisor
      # advierte (ver docs/CI_CD_HYPERVISOR_SETUP.md).
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: hashicorp/setup-terraform@v3

      - uses: azure/setup-kubectl@v5
        with:
          version: "v1.34.1"

      - uses: azure/setup-helm@v5
        with:
          version: "3.17.3"

      - name: Install helmfile
        run: |
          curl -sSL "https://github.com/helmfile/helmfile/releases/download/v1.5.0/helmfile_1.5.0_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin helmfile

      - name: Write R2 backend config (infra)
        working-directory: terraform/infra
        run: |
          cat > backend.hcl <<EOF
          endpoints = {
            s3 = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          EOF

      - name: Terraform apply (infra)
        working-directory: terraform/infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_proxmox_endpoint: ${{ vars.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
          TF_VAR_talos_schematic_id: ${{ vars.TALOS_SCHEMATIC_ID }}
          TF_VAR_vm_static_ip: ${{ vars.VM_STATIC_IP }}
          TF_VAR_vm_gateway: ${{ vars.VM_GATEWAY }}
        run: |
          terraform init -backend-config=backend.hcl
          terraform apply -auto-approve -input=false

      - name: Bootstrap cluster (Cilium, ArgoCD via helmfile, OpenEBS)
        working-directory: ansible
        run: ansible-playbook site.yaml

      - name: Write R2 backend config (cluster)
        working-directory: terraform/cluster
        run: |
          cat > backend.hcl <<EOF
          endpoints = {
            s3 = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          EOF

      - name: Terraform apply (cluster namespaces/secrets)
        working-directory: terraform/cluster
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_kubeconfig_path: ${{ github.workspace }}/terraform/infra/generated/kubeconfig
          TF_VAR_argocd_github_pat: ${{ secrets.ARGOCD_GITHUB_PAT }}
          TF_VAR_openbao_static_seal_key: ${{ secrets.OPENBAO_STATIC_SEAL_KEY }}
        run: |
          terraform init -backend-config=backend.hcl
          terraform apply -auto-approve -input=false

      # Ultimo paso del bootstrap: registra la Application raiz de ArgoCD,
      # que ya tiene su namespace/secrets creados por terraform/cluster.
      - name: Register ArgoCD root Application
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/infra/generated/kubeconfig
        run: kubectl apply -f gitops/root-app.yaml

      - name: Populate OpenBao secrets
        working-directory: ansible
        run: ansible-playbook vault-populate.yaml

      - name: Populate extra secrets
        working-directory: ansible
        run: ansible-playbook load-extra-secrets.yaml
