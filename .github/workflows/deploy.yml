name: Deploy

on:
  push:
    branches: [master]
    paths:
      - "terraform/**"
      - "ansible/**"
  workflow_dispatch: {}

concurrency:
  group: homelab-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision-and-configure:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python for Ansible
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Ansible
        run: pip install ansible

      # Fail fast if a required credential is missing, before provisioning anything.
      - name: Preflight - validate secrets
        working-directory: ansible
        env:
          ARGOCD_GITHUB_PAT: ${{ secrets.ARGOCD_GITHUB_PAT }}
          ARGOCD_REPO_URL: ${{ vars.ARGOCD_REPO_URL }}
        run: ansible-playbook preflight.yaml

      # Reaches Proxmox/Talos on the homelab LAN via the subnet route the hypervisor advertises.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: hashicorp/setup-terraform@v3

      - uses: azure/setup-kubectl@v5
        with:
          version: "v1.37.1"

      - uses: azure/setup-helm@v5
        with:
          version: "3.22.0"

      - name: Write R2 backend config (infra)
        working-directory: terraform/infra
        run: |
          cat > backend.hcl <<EOF
          endpoints = {
            s3 = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          EOF

      - name: Terraform apply (infra)
        working-directory: terraform/infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_proxmox_endpoint: ${{ vars.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
          TF_VAR_talos_schematic_id: ${{ vars.TALOS_SCHEMATIC_ID }}
          TF_VAR_vm_static_ip: ${{ vars.VM_STATIC_IP }}
          TF_VAR_vm_gateway: ${{ vars.VM_GATEWAY }}
        run: |
          terraform init -backend-config=backend.hcl
          terraform apply -auto-approve -input=false

      - name: Write R2 backend config (cluster)
        working-directory: terraform/cluster
        run: |
          cat > backend.hcl <<EOF
          endpoints = {
            s3 = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          EOF

      - name: Wait for Kubernetes API to be stable
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/infra/generated/kubeconfig
        run: |
          echo "Waiting for initial API response..."
          for i in {1..30}; do kubectl get --raw /healthz && break || sleep 10; done
          echo "Confirming API stability..."
          for i in {1..6}; do kubectl get --raw /healthz && sleep 5 || exit 1; done

      - name: Terraform apply (cluster bootstrap and config)
        working-directory: terraform/cluster
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_kubeconfig_path: ${{ github.workspace }}/terraform/infra/generated/kubeconfig
          TF_VAR_argocd_github_pat: ${{ secrets.ARGOCD_GITHUB_PAT }}
        run: |
          terraform init -backend-config=backend.hcl
          terraform apply -auto-approve -input=false

      - name: Diagnostico de cluster en caso de fallo
        if: failure()
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/infra/generated/kubeconfig
        run: |
          set -o pipefail
          echo "=== PODS ==="
          kubectl get pods -A -o wide || true
          echo "=== EVENTOS ==="
          kubectl get events -A --sort-by=.lastTimestamp || true
          echo "=== LOGS DE PODS NO LISTOS ==="
          for ns in kube-system argocd; do
            for p in $(kubectl get pods -n "$ns" -o json | jq -r '.items[]? | select(.status.phase!="Running" or any(.status.containerStatuses[]?; .ready==false)) | .metadata.name'); do
              echo "=== describe pod/$ns/$p ==="
              kubectl describe pod -n "$ns" "$p" || true
              echo "=== logs pod/$ns/$p ==="
              kubectl logs -n "$ns" "$p" --all-containers --tail=200 || true
            done
          done

      # Apps depending on real secrets stay Progressing/Degraded until
      # scripts/apply-real-secrets.sh is run manually - expected, not a pipeline failure.
      - name: Register ArgoCD root Application
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/infra/generated/kubeconfig
        run: kubectl apply -f gitops/root-app.yaml

      # Data-service engines (postgresql/mongodb/qdrant/redis) each run in their own LXC.
      - name: Write CI SSH key for the data LXCs
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PROXMOX_SSH_PRIVATE_KEY }}" > ~/.ssh/ci_ed25519
          chmod 600 ~/.ssh/ci_ed25519
          ssh-keygen -y -f ~/.ssh/ci_ed25519 > ~/.ssh/ci_ed25519.pub

      # Pass the pubkey via env var, not -e: it contains spaces, and Ansible
      # truncates a -e key=value pair at the first space.
      - name: Bootstrap SSH access to the data LXCs
        working-directory: ansible
        run: |
          export ANSIBLE_SSH_BOOTSTRAP_PUBKEY="$(cat "$HOME/.ssh/ci_ed25519.pub")"
          ansible-playbook bootstrap-lxc-ssh.yaml --limit data_lxcs \
            -e proxmox_ssh_user=root \
            -e proxmox_ssh_private_key_file="$HOME/.ssh/ci_ed25519"

      # Only ansible/data-services.env is decrypted here; SopsSecret CRDs are
      # decrypted in-cluster by sops-secrets-operator, not by CI.
      - name: Install sops
        run: |
          curl -sL -o /usr/local/bin/sops \
            https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          chmod +x /usr/local/bin/sops

      - name: Provision data-service engines via Podman Quadlet
        working-directory: ansible
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          sops exec-env data-services.env \
            'ansible-playbook data-services.yaml --limit data_lxcs -e ansible_ssh_private_key_file="$HOME/.ssh/ci_ed25519"'
