name: Deploy

on:
  push:
    branches: [master]
    paths:
      - "terraform/**"
      - "ansible/**"
  workflow_dispatch: {}

concurrency:
  group: homelab-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision-and-configure:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for Ansible
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible

      # Falla en segundos si falta o es invalida una credencial, antes de
      # gastar tiempo conectando Tailscale y aprovisionando la VM. Solo
      # valida lo que Terraform realmente consume mas abajo en este mismo
      # job.
      - name: Preflight - validate secrets
        working-directory: ansible
        env:
          ARGOCD_GITHUB_PAT: ${{ secrets.ARGOCD_GITHUB_PAT }}
          ARGOCD_REPO_URL: ${{ vars.ARGOCD_REPO_URL }}
        run: ansible-playbook preflight.yaml

      # Necesario porque Proxmox y la VM Talos viven en la LAN del homelab
      # (192.168.80.0/24), no publicamente alcanzable - el runner hosted
      # llega vía la ruta de subred que el nodo Tailscale del hipervisor
      # advierte (ver docs/CI_CD_HYPERVISOR_SETUP.md).
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: hashicorp/setup-terraform@v3

      - uses: azure/setup-kubectl@v5
        with:
          version: "v1.34.1"

      - uses: azure/setup-helm@v5
        with:
          version: "3.17.3"

      - name: Write R2 backend config (infra)
        working-directory: terraform/infra
        run: |
          cat > backend.hcl <<EOF
          endpoints = {
            s3 = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          EOF

      - name: Terraform apply (infra)
        working-directory: terraform/infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_proxmox_endpoint: ${{ vars.PROXMOX_ENDPOINT }}
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
          TF_VAR_talos_schematic_id: ${{ vars.TALOS_SCHEMATIC_ID }}
          TF_VAR_vm_static_ip: ${{ vars.VM_STATIC_IP }}
          TF_VAR_vm_gateway: ${{ vars.VM_GATEWAY }}
        run: |
          terraform init -backend-config=backend.hcl
          terraform apply -auto-approve -input=false

      - name: Write R2 backend config (cluster)
        working-directory: terraform/cluster
        run: |
          cat > backend.hcl <<EOF
          endpoints = {
            s3 = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
          EOF

      - name: Wait for Kubernetes API to be stable
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/infra/generated/kubeconfig
        run: |
          echo "Waiting for initial API response..."
          for i in {1..30}; do kubectl get --raw /healthz && break || sleep 10; done
          echo "Confirming API stability..."
          for i in {1..6}; do kubectl get --raw /healthz && sleep 5 || exit 1; done

      - name: Terraform apply (cluster bootstrap and config)
        working-directory: terraform/cluster
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_kubeconfig_path: ${{ github.workspace }}/terraform/infra/generated/kubeconfig
          TF_VAR_argocd_github_pat: ${{ secrets.ARGOCD_GITHUB_PAT }}
        run: |
          terraform init -backend-config=backend.hcl
          terraform apply -auto-approve -input=false

      - name: Diagnostico de cluster en caso de fallo
        if: failure()
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/infra/generated/kubeconfig
        run: |
          set -o pipefail
          echo "=== PODS ==="
          kubectl get pods -A -o wide || true
          echo "=== EVENTOS ==="
          kubectl get events -A --sort-by=.lastTimestamp || true
          echo "=== LOGS DE PODS NO LISTOS ==="
          for ns in kube-system argocd; do
            for p in $(kubectl get pods -n "$ns" -o json | jq -r '.items[]? | select(.status.phase!="Running" or any(.status.containerStatuses[]?; .ready==false)) | .metadata.name'); do
              echo "=== describe pod/$ns/$p ==="
              kubectl describe pod -n "$ns" "$p" || true
              echo "=== logs pod/$ns/$p ==="
              kubectl logs -n "$ns" "$p" --all-containers --tail=200 || true
            done
          done

      # Ultimo paso del bootstrap: registra la Application raiz de ArgoCD,
      # que ya tiene su namespace/secrets creados por terraform/cluster. Los
      # secrets reales viven en 1Password (vault "Homelab", ver
      # platform/secret-management/) - las Applications que dependen de ellos
      # quedan en Progressing/Degraded hasta que exista el Secret con el
      # token del Service Account (onepassword-service-account-token, ns
      # secret-management) y el vault tenga los items - es esperado, no un
      # fallo del pipeline.
      - name: Register ArgoCD root Application
        env:
          KUBECONFIG: ${{ github.workspace }}/terraform/infra/generated/kubeconfig
        run: kubectl apply -f gitops/root-app.yaml

      # Motores de datos (postgresql/mongodb/qdrant/redis) en sus LXCs.
      - name: Write CI SSH key for the data LXCs
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PROXMOX_SSH_PRIVATE_KEY }}" > ~/.ssh/ci_ed25519
          chmod 600 ~/.ssh/ci_ed25519
          ssh-keygen -y -f ~/.ssh/ci_ed25519 > ~/.ssh/ci_ed25519.pub

      - name: Bootstrap SSH access to the data LXCs
        working-directory: ansible
        run: |
          ansible-playbook bootstrap-lxc-ssh.yaml --limit data_lxcs \
            -e proxmox_ssh_user=root \
            -e proxmox_ssh_private_key_file="$HOME/.ssh/ci_ed25519" \
            -e ansible_ssh_bootstrap_pubkey="$(cat "$HOME/.ssh/ci_ed25519.pub")"

      - name: Provision data-service engines via Podman Quadlet
        working-directory: ansible
        env:
          POSTGRESQL_APP_USERNAME: ${{ secrets.POSTGRESQL_APP_USERNAME }}
          POSTGRESQL_APP_PASSWORD: ${{ secrets.POSTGRESQL_APP_PASSWORD }}
          MONGODB_APP_PASSWORD: ${{ secrets.MONGODB_APP_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          SONARQUBE_DB_USERNAME: ${{ secrets.SONARQUBE_DB_USERNAME }}
          SONARQUBE_DB_PASSWORD: ${{ secrets.SONARQUBE_DB_PASSWORD }}
        run: |
          ansible-playbook data-services.yaml --limit data_lxcs \
            -e ansible_ssh_private_key_file="$HOME/.ssh/ci_ed25519"
