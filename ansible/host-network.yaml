---
- name: Reenviar trafico LAN del host hacia la VM del nodo k0s
  hosts: hypervisor
  become: true
  # No se usa ningun ansible_fact aca (solo vars propias) - desactivado para
  # no requerir sudo tambien para el modulo de gathering (solo firewall-cmd
  # tiene NOPASSWD en el sudoers del host).
  gather_facts: false

  vars:
    # Puerto de entrada en el host -> puerto:IP real del Gateway dentro de
    # la red NAT de libvirt (IP fija via Cilium L2 Announcements, ver
    # platform/networking/cilium-gateway/). agentgateway-mcp ya no tiene IP
    # propia - sus rutas se reenvian puertas adentro desde `main` (ADR-012).
    forward_rules:
      - { port: 80, toport: 80, toaddr: "{{ cilium_gateway_lb_ip }}", proto: tcp }
      - { port: 443, toport: 443, toaddr: "{{ cilium_gateway_lb_ip }}", proto: tcp }
      # DNS privado (platform/networking/private-dns/) - un dispositivo LAN
      # configura este host (192.168.80.20) como su DNS y llega al CoreDNS
      # interno que resuelve las rutas privadas.
      - { port: 53, toport: 53, toaddr: "{{ private_dns_ip }}", proto: udp }
      - { port: 53, toport: 53, toaddr: "{{ private_dns_ip }}", proto: tcp }

  tasks:
    - name: Detectar la zona activa de firewalld para la interfaz LAN
      ansible.builtin.command: >
        firewall-cmd --get-zone-of-interface={{ host_lan_interface }}
      register: fw_zone
      changed_when: false

    - name: Habilitar masquerade en la zona LAN
      ansible.builtin.command: >
        firewall-cmd --zone={{ fw_zone.stdout }} --add-masquerade --permanent
      register: fw_masq
      changed_when: "'ALREADY_ENABLED' not in fw_masq.stderr"
      failed_when: fw_masq.rc != 0 and 'ALREADY_ENABLED' not in fw_masq.stderr

    # Tailscale subnet router: el trafico del tailnet hacia la red NAT de
    # libvirt NO pasa por el DNAT de los forward-port (el destino ya es la IP
    # interna directamente), asi que la aceptacion implicita `ct status dnat`
    # de firewalld no aplica y todo cae en el reject inter-zona por defecto.
    # Receta oficial de Tailscale para firewalld: tailscale0 en la zona
    # trusted + una policy trusted->libvirt con target ACCEPT.
    - name: Verificar si tailscale0 ya esta en la zona trusted
      ansible.builtin.command: >
        firewall-cmd --permanent --zone=trusted --query-interface=tailscale0
      register: ts_zone_query
      failed_when: false
      changed_when: false

    - name: Agregar tailscale0 a la zona trusted
      ansible.builtin.command: >
        firewall-cmd --permanent --zone=trusted --add-interface=tailscale0
      when: ts_zone_query.rc != 0

    - name: Verificar si la policy ts_to_libvirt ya existe
      ansible.builtin.command: >
        firewall-cmd --permanent --info-policy=ts_to_libvirt
      register: ts_policy_query
      failed_when: false
      changed_when: false

    - name: Crear la policy ts_to_libvirt
      ansible.builtin.command: firewall-cmd --permanent --new-policy=ts_to_libvirt
      when: ts_policy_query.rc != 0

    - name: Configurar ingress/egress y target de la policy
      ansible.builtin.command: >
        firewall-cmd --permanent --policy=ts_to_libvirt {{ item }}
      loop:
        - --add-ingress-zone=trusted
        - --add-egress-zone=libvirt
        - --set-target=ACCEPT
      register: ts_policy_cfg
      failed_when: ts_policy_cfg.rc != 0 and 'ALREADY' not in ts_policy_cfg.stderr

    - name: Verificar si el forward-port ya existe
      ansible.builtin.command: >
        firewall-cmd --zone={{ fw_zone.stdout }}
        --query-forward-port=port={{ item.port }}:proto={{ item.proto }}:toport={{ item.toport }}:toaddr={{ item.toaddr }}
      register: fw_query
      failed_when: false
      changed_when: false
      loop: "{{ forward_rules }}"

    - name: Agregar forward-port hacia el Gateway correspondiente
      ansible.builtin.command: >
        firewall-cmd --zone={{ fw_zone.stdout }} --permanent
        --add-forward-port=port={{ item.item.port }}:proto={{ item.item.proto }}:toport={{ item.item.toport }}:toaddr={{ item.item.toaddr }}
      when: item.rc != 0
      loop: "{{ fw_query.results }}"

    - name: Recargar firewalld
      ansible.builtin.command: firewall-cmd --reload
      changed_when: true

    # La politica de seguridad por defecto de libvirt para redes NAT
    # (tabla `ip libvirt_network`, cadena `guest_input`) rechaza cualquier
    # conexion NUEVA entrante hacia la red virtual, incluso ya aplicado el
    # DNAT de arriba - descubierto troubleshooteando el forward-port en
    # produccion (ver docs/DECISIONS.md ADR-011). Sin esto, firewalld hace
    # bien su parte pero libvirt lo rechaza despues.
    - name: Crear el directorio de hooks de libvirt
      ansible.builtin.file:
        path: /etc/libvirt/hooks
        state: directory
        mode: "0755"

    - name: Instalar el hook de red de libvirt (excepcion de firewall)
      ansible.builtin.template:
        src: templates/libvirt-network-hook.sh.j2
        dest: /etc/libvirt/hooks/network
        mode: "0755"

    - name: Aplicar el hook ahora (sin esperar al proximo restart de la red)
      ansible.builtin.command: /etc/libvirt/hooks/network default started - -
      changed_when: true
