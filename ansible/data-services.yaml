# Provisions the four data-service engines as systemd-managed Podman
# containers (Quadlet). Credentials are always read from the environment,
# never hardcoded.
---
- name: Provision data-service engines via Podman Quadlet
  hosts: data_lxcs
  vars:
    postgresql_app_username: "{{ lookup('env', 'POSTGRESQL_APP_USERNAME') }}"
    postgresql_app_password: "{{ lookup('env', 'POSTGRESQL_APP_PASSWORD') }}"
    mongodb_app_password: "{{ lookup('env', 'MONGODB_APP_PASSWORD') }}"
    redis_password: "{{ lookup('env', 'REDIS_PASSWORD') }}"
    sonarqube_db_username: "{{ lookup('env', 'SONARQUBE_DB_USERNAME') }}"
    sonarqube_db_password: "{{ lookup('env', 'SONARQUBE_DB_PASSWORD') }}"
    mysql_app_password: "{{ lookup('env', 'MYSQL_APP_PASSWORD') }}"
    kimai_db_username: "{{ lookup('env', 'KIMAI_DB_USERNAME') }}"
    kimai_db_password: "{{ lookup('env', 'KIMAI_DB_PASSWORD') }}"
    firefly_db_username: "{{ lookup('env', 'FIREFLY_DB_USERNAME') }}"
    firefly_db_password: "{{ lookup('env', 'FIREFLY_DB_PASSWORD') }}"
    n8n_db_username: "{{ lookup('env', 'N8N_DB_USERNAME') }}"
    n8n_db_password: "{{ lookup('env', 'N8N_DB_PASSWORD') }}"
    hindsight_db_username: "{{ lookup('env', 'HINDSIGHT_DB_USERNAME') }}"
    hindsight_db_password: "{{ lookup('env', 'HINDSIGHT_DB_PASSWORD') }}"

  tasks:
    - name: Fail loudly if any engine credential is missing
      ansible.builtin.fail:
        msg: >-
          {{ item }} is empty. Source secrets/homelab.env (the same way
          ansible/preflight.yaml already does) before running this playbook.
      when: vars[item] | length == 0
      loop:
        - postgresql_app_username
        - postgresql_app_password
        - mongodb_app_password
        - redis_password
        - sonarqube_db_username
        - sonarqube_db_password
        - mysql_app_password
        - kimai_db_username
        - kimai_db_password
        - firefly_db_username
        - firefly_db_password
        - n8n_db_username
        - n8n_db_password
        - hindsight_db_username
        - hindsight_db_password
      delegate_to: localhost
      run_once: true

    - name: Install Podman and enable the auto-update timer
      ansible.builtin.include_tasks: tasks/install-podman.yaml

    - name: Ensure the bind-mount data directory exists
      ansible.builtin.file:
        path: "/srv/{{ inventory_hostname }}"
        state: directory
        mode: "0755"

    - name: Template the Quadlet unit for this engine
      ansible.builtin.template:
        src: "templates/{{ inventory_hostname }}.container.j2"
        dest: "/etc/containers/systemd/{{ inventory_hostname }}.container"
        mode: "0600"
      register: quadlet_unit
      no_log: true

    - name: Reload systemd so the generated Quadlet unit is picked up
      ansible.builtin.systemd:
        daemon_reload: true

    # `started` alone leaves a running engine on its old image, so a changed
    # unit (e.g. the pgvector image swap) has to restart it to take effect.
    - name: Start the generated engine service, restarting it if its unit changed
      ansible.builtin.systemd:
        name: "{{ inventory_hostname }}.service"
        state: "{{ 'restarted' if quadlet_unit is changed else 'started' }}"
        enabled: true

    - name: Provision the sonarqube, n8n, firefly and hindsight databases on the shared PostgreSQL instance
      when: inventory_hostname == 'postgresql'
      no_log: true
      block:
        - name: Install psycopg2, required by the community.postgresql modules below
          ansible.builtin.apt:
            name: python3-psycopg2
            state: present

        - name: Wait for PostgreSQL to accept connections
          ansible.builtin.wait_for:
            port: 5432
            host: localhost
            delay: 2
            timeout: 30

        - name: Create the sonarqube role
          community.postgresql.postgresql_user:
            name: "{{ sonarqube_db_username }}"
            password: "{{ sonarqube_db_password }}"
            db: postgres
            login_user: "{{ postgresql_app_username }}"
            login_password: "{{ postgresql_app_password }}"
            login_host: localhost

        - name: Create the sonarqube database owned by that role
          community.postgresql.postgresql_db:
            name: sonarqube
            owner: "{{ sonarqube_db_username }}"
            login_user: "{{ postgresql_app_username }}"
            login_password: "{{ postgresql_app_password }}"
            login_host: localhost

        - name: Create the n8n role
          community.postgresql.postgresql_user:
            name: "{{ n8n_db_username }}"
            password: "{{ n8n_db_password }}"
            db: postgres
            login_user: "{{ postgresql_app_username }}"
            login_password: "{{ postgresql_app_password }}"
            login_host: localhost

        - name: Create the n8n database owned by that role
          community.postgresql.postgresql_db:
            name: n8n
            owner: "{{ n8n_db_username }}"
            login_user: "{{ postgresql_app_username }}"
            login_password: "{{ postgresql_app_password }}"
            login_host: localhost

        - name: Create the firefly role
          community.postgresql.postgresql_user:
            name: "{{ firefly_db_username }}"
            password: "{{ firefly_db_password }}"
            db: postgres
            login_user: "{{ postgresql_app_username }}"
            login_password: "{{ postgresql_app_password }}"
            login_host: localhost

        - name: Create the firefly database owned by that role
          community.postgresql.postgresql_db:
            name: firefly
            owner: "{{ firefly_db_username }}"
            login_user: "{{ postgresql_app_username }}"
            login_password: "{{ postgresql_app_password }}"
            login_host: localhost

        - name: Create the hindsight role
          community.postgresql.postgresql_user:
            name: "{{ hindsight_db_username }}"
            password: "{{ hindsight_db_password }}"
            db: postgres
            login_user: "{{ postgresql_app_username }}"
            login_password: "{{ postgresql_app_password }}"
            login_host: localhost

        - name: Create the hindsight database owned by that role
          community.postgresql.postgresql_db:
            name: hindsight
            owner: "{{ hindsight_db_username }}"
            login_user: "{{ postgresql_app_username }}"
            login_password: "{{ postgresql_app_password }}"
            login_host: localhost

        # Needs the pgvector image (postgresql.container.j2); only this database gets it.
        - name: Enable the pgvector extension in the hindsight database
          community.postgresql.postgresql_ext:
            name: vector
            db: hindsight
            login_user: "{{ postgresql_app_username }}"
            login_password: "{{ postgresql_app_password }}"
            login_host: localhost

    - name: Provision the kimai database on the shared MySQL instance
      when: inventory_hostname == 'mysql'
      no_log: true
      block:
        - name: Install PyMySQL, required by the community.mysql modules below
          ansible.builtin.apt:
            name: python3-pymysql
            state: present

        - name: Wait for MySQL to accept connections
          ansible.builtin.wait_for:
            port: 3306
            host: localhost
            delay: 2
            timeout: 30

        - name: Create the kimai database
          community.mysql.mysql_db:
            name: kimai
            state: present
            login_user: root
            login_password: "{{ mysql_app_password }}"
            login_host: localhost

        - name: Create the kimai user, scoped to its own database
          community.mysql.mysql_user:
            name: "{{ kimai_db_username }}"
            password: "{{ kimai_db_password }}"
            # host defaults to localhost, but Kimai connects over the network
            # from a pod, not from this LXC itself.
            host: "%"
            priv: "kimai.*:ALL"
            login_user: root
            login_password: "{{ mysql_app_password }}"
            login_host: localhost
