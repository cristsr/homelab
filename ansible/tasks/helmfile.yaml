---
- name: Download Helmfile v{{ helmfile_version }}
  ansible.builtin.get_url:
    url: "https://github.com/helmfile/helmfile/releases/download/v{{ helmfile_version }}/helmfile_{{ helmfile_version }}_linux_amd64.tar.gz"
    dest: /tmp/helmfile.tar.gz
    mode: "0644"
    force: false
  tags: [ helmfile ]

- name: Extract helmfile binary
  ansible.builtin.unarchive:
    src: /tmp/helmfile.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include:
      - helmfile
    creates: /usr/local/bin/helmfile
    mode: "0755"
  tags: [ helmfile ]

# El nodo corre en una VM aparte del control node (ver ADR-008): bootstrap/
# vive en el repo del host, no en la VM, asi que hay que copiarlo antes de
# invocar helmfile (que resuelve sus values.yaml relativos al chdir).
- name: Sincronizar bootstrap/ a la VM
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../bootstrap/"
    dest: /opt/homelab-bootstrap/
    mode: preserve
  tags: [ helmfile ]

- name: Bootstrap Cilium and ArgoCD via helmfile
  ansible.builtin.command: helmfile sync
  args:
    chdir: /opt/homelab-bootstrap
  become: true
  environment:
    KUBECONFIG: /var/lib/k0s/pki/admin.conf
  tags: [ helmfile ]

- name: Wait for node to reach Ready state (after Cilium)
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready node --all --timeout=60s
  register: node_wait
  until: node_wait.rc == 0
  retries: 20
  delay: 20
  changed_when: false
  become: false
  tags: [ helmfile ]
