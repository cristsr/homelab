---
# El bootstrap de Talos (talos_machine_bootstrap) dispara la formacion de
# etcd + el arranque de los pods estaticos del control plane, pero eso no
# es instantaneo - Terraform ya considero "listo" el bootstrap apenas la
# API de Talos acepto el comando, no cuando el apiserver de Kubernetes
# empieza a aceptar conexiones. Sin este wait, helmfile falla con
# "connection refused" contra :6443 (confirmado en un deploy real).
- name: Esperar a que el API server de Kubernetes responda
  ansible.builtin.command: kubectl get --raw /healthz
  register: apiserver_health
  until: apiserver_health.rc == 0
  retries: 30
  delay: 10
  changed_when: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  tags: [ helmfile ]

# El primer healthz exitoso no es garantia de estabilidad: el apiserver
# puede seguir reiniciando/reconciliando segundos despues de responder por
# primera vez, justo tras el bootstrap (confirmado en un deploy real:
# "connection refused" en el helmfile sync, 9s despues de un healthz OK).
- name: Confirmar que el API server sigue respondiendo de forma estable
  ansible.builtin.command: kubectl get --raw /healthz
  register: apiserver_health_stable
  until: apiserver_health_stable.rc == 0
  retries: 6
  delay: 5
  changed_when: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  tags: [ helmfile ]

# bootstrap/ ya esta local (mismo checkout del repo que corre Ansible) - a
# diferencia de la VM Fedora anterior, no hay nada que copiar antes de
# invocar helmfile.
- block:
    - name: Bootstrap Cilium and ArgoCD via helmfile
      ansible.builtin.command: helmfile sync
      args:
        chdir: "{{ playbook_dir }}/../bootstrap"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
  rescue:
    # Si helmfile falla, esto vuelca el estado real del cluster al log de
    # CI antes de re-lanzar el error - evita tener que pedir acceso al
    # cluster para diagnosticar cada vez que algo se cuelga.
    - name: Diagnostico - pods en kube-system y argocd
      ansible.builtin.command: kubectl get pods -A -o wide
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false
      ignore_errors: true

    - name: Diagnostico - eventos recientes del cluster
      ansible.builtin.command: >
        kubectl get events -A --sort-by=.lastTimestamp
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false
      ignore_errors: true

    - name: Diagnostico - describe y logs de pods no listos en argocd
      ansible.builtin.shell: |
        set -o pipefail
        for p in $(kubectl get pods -n argocd -o json | jq -r '.items[] | select(.status.phase!="Running" or any(.status.containerStatuses[]?; .ready==false)) | .metadata.name'); do
          echo "=== describe pod/$p ==="
          kubectl describe pod -n argocd "$p"
          echo "=== logs pod/$p ==="
          kubectl logs -n argocd "$p" --all-containers --tail=200 || true
        done
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: false
      ignore_errors: true

    - name: Re-lanzar el fallo original de helmfile
      ansible.builtin.fail:
        msg: "helmfile sync fallo - ver diagnostico arriba en el log"
  tags: [ helmfile ]

- name: Wait for node to reach Ready state (after Cilium)
  ansible.builtin.command: >
    kubectl wait --for=condition=Ready node --all --timeout=60s
  register: node_wait
  until: node_wait.rc == 0
  retries: 20
  delay: 20
  changed_when: false
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  tags: [ helmfile ]
