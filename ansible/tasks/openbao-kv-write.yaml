---
# Reusable: escribe una lista de secretos en OpenBao KV via port-forward.
# Parametros esperados del caller (via `vars:` en el import_tasks):
#   bao_url                   - ej. "http://127.0.0.1:8200"
#   openbao_root_token        - token con permiso de escritura en KV
#   openbao_pf_pid_file       - ruta unica para el pid del port-forward
#   openbao_secrets_to_write  - lista de {path, data}
#
# El always envuelve TODO el bloque (arranque del port-forward incluido),
# no solo la escritura: un fallo en el wait de salud tambien limpia el
# proceso, en vez de dejarlo huerfano en el runner/VM.
#
# Nota: este mecanismo no valida que los valores no esten vacios - esa
# semantica depende del caller (para credenciales obligatorias como en
# vault-populate.yaml, vacio es un error; para extra-secrets.yaml, vacio es
# valido y significa "app no usada"). Ese guard vive en quien invoca este
# tasks file, no aqui.

- block:
    - name: Iniciar port-forward hacia OpenBao
      ansible.builtin.shell: |
        setsid nohup kubectl port-forward svc/openbao 8200:8200 -n secret-management \
          < /dev/null > {{ openbao_pf_pid_file }}.log 2>&1 &
        echo $! > {{ openbao_pf_pid_file }}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      become: false
      changed_when: false

    - name: Esperar a que el port-forward levante el puerto 8200
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8200
        timeout: 15
      become: false

    - name: Esperar a que OpenBao responda saludable
      ansible.builtin.uri:
        url: "{{ bao_url }}/v1/sys/health"
        method: GET
        status_code: 200
      register: bao_health
      until: bao_health.status == 200
      retries: 30
      delay: 2
      become: false

    - name: Escribir secretos en OpenBao KV
      ansible.builtin.uri:
        url: "{{ bao_url }}/v1/secret/data/{{ item.path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ openbao_root_token }}"
        body_format: json
        body:
          data: "{{ item.data }}"
        status_code: 200
      loop: "{{ openbao_secrets_to_write }}"
      loop_control:
        label: "{{ item.path }}"
      become: false
      no_log: true

  always:
    - name: Detener el port-forward y limpiar archivos temporales
      ansible.builtin.shell: |
        if [ -f {{ openbao_pf_pid_file }} ]; then
          kill $(cat {{ openbao_pf_pid_file }}) 2>/dev/null || true
        fi
        rm -f {{ openbao_pf_pid_file }} {{ openbao_pf_pid_file }}.log
      become: false
      changed_when: false
