---
# Guard clause: falla en segundos si falta una credencial, en vez de
# descubrirlo a mitad del pipeline (ver ansible/preflight.yaml).
- name: Validar formato y longitud minima de las credenciales requeridas
  ansible.builtin.assert:
    that:
      - item.value | length >= item.min_length
    fail_msg: >-
      "{{ item.name }}" no esta definida, esta vacia, o es mas corta de lo
      esperado ({{ item.min_length }} caracteres minimo). Revisa
      `ansible-vault edit ansible/group_vars/all.yaml`.
    quiet: true
  loop:
    - name: argocd_github_pat
      value: "{{ argocd_github_pat | default('') }}"
      min_length: 20
    - name: argocd_repo_url
      value: "{{ argocd_repo_url | default('') }}"
      min_length: 10
    - name: argocd_webhook_secret
      value: "{{ argocd_webhook_secret | default('') }}"
      min_length: 16
    - name: cloudflare_api_token
      value: "{{ cloudflare_api_token | default('') }}"
      min_length: 20
    - name: cloudflared_token
      value: "{{ cloudflared_token | default('') }}"
      min_length: 20
    - name: openbao_static_seal_key
      value: "{{ openbao_static_seal_key | default('') }}"
      min_length: 16
  loop_control:
    label: "{{ item.name }}"
  no_log: true
