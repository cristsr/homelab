---
# Guard clause: fails immediately if a credential is missing or too short,
# instead of discovering it mid-pipeline.
- name: Validate format and minimum length of the required credentials
  ansible.builtin.assert:
    that:
      - item.value | length >= item.min_length
    fail_msg: >-
      "{{ item.name }}" is not defined, is empty, or is shorter than
      expected ({{ item.min_length }} characters minimum). Check
      `secrets/homelab.env` and re-export it (`set -a; source
      secrets/homelab.env; set +a`).
    quiet: true
  loop:
    - name: argocd_github_pat
      value: "{{ argocd_github_pat | default('') }}"
      min_length: 20
    - name: argocd_repo_url
      value: "{{ argocd_repo_url | default('') }}"
      min_length: 10
  loop_control:
    label: "{{ item.name }}"
  no_log: true
