---
# Talos es inmutable y no tiene SSH/shell al host, ni siquiera con la
# extension zfs instalada - el unico mecanismo soportado para correr
# `zpool create` es un pod de debug privilegiado que monta la raiz del host
# en /host (ver README de siderolabs/extensions/storage/zfs). El pool solo
# puede montar bajo /var/<algo> - restriccion real del filesystem de Talos.
#
# Corre despues de tasks/helmfile.yaml (Cilium+cluster deben estar Ready
# para que `kubectl debug node/...` funcione) y antes de que ArgoCD
# sincronice gitops/apps/platform/storage/openebs.yaml.

- name: Comprobar si el zpool ya existe (idempotencia)
  ansible.builtin.command: >
    kubectl debug node/{{ talos_node_name }} --profile=sysadmin --image=alpine
    -- chroot /host zpool list {{ openebs_zfs_pool_name }}
  register: zpool_check
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  failed_when: false
  changed_when: false
  tags: [openebs]

- name: Crear el zpool para OpenEBS ZFS LocalPV
  ansible.builtin.command: >
    kubectl debug node/{{ talos_node_name }} --profile=sysadmin --image=alpine
    -- chroot /host zpool create -f
    -o ashift=12
    -O mountpoint=/var/openebs/{{ openebs_zfs_pool_name }}
    -O compression=zstd
    -O atime=off
    {{ openebs_zfs_pool_name }} /dev/vdb
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: true
  when: zpool_check.rc != 0
  tags: [openebs]
