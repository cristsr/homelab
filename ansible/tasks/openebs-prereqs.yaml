---
# OpenEBS Local PV LVM necesita lvm2 en el host y un Volume Group ya creado
# sobre el disco dedicado (vdb, ver terraform/main.tf) - el CSI driver
# provisiona LVs dentro de ese VG, nunca crea el VG el mismo.

- name: Install lvm2 (OpenEBS LVM LocalPV requirement)
  ansible.builtin.dnf:
    name: lvm2
    state: present
  tags: [openebs]

- name: Check if openebs Volume Group already exists
  ansible.builtin.command: "vgs {{ openebs_lvm_vg_name }}"
  register: openebs_vg_check
  changed_when: false
  failed_when: false
  tags: [openebs]

- name: Create physical volume on the dedicated OpenEBS disk
  ansible.builtin.command: "pvcreate {{ openebs_lvm_disk_device }}"
  when: openebs_vg_check.rc != 0
  tags: [openebs]

- name: Create OpenEBS Volume Group
  ansible.builtin.command: "vgcreate {{ openebs_lvm_vg_name }} {{ openebs_lvm_disk_device }}"
  when: openebs_vg_check.rc != 0
  tags: [openebs]
