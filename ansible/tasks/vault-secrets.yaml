---
- name: Create secret-management namespace
  ansible.builtin.shell: |
    kubectl create namespace secret-management --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
  tags: [vault]

- name: Deploy OpenBao static unseal key
  ansible.builtin.shell: |
    kubectl create secret generic openbao-static-unseal-key \
      --namespace secret-management \
      --from-literal=key="$OPENBAO_STATIC_SEAL_KEY" \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
    OPENBAO_STATIC_SEAL_KEY: "{{ openbao_static_seal_key }}"
  changed_when: false
  no_log: true
  tags: [vault]
