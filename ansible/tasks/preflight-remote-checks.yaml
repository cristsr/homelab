---
# Confirms the PAT actually works against the real repo, not just that it has
# a value, before terraform apply runs.

- name: Verificar que el PAT de GitHub tiene acceso al repo de ArgoCD
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ argocd_repo_url | regex_replace('^https://github.com/', '') }}"
    method: GET
    headers:
      Authorization: "token {{ argocd_github_pat }}"
      Accept: "application/vnd.github+json"
    status_code: 200
  no_log: true
