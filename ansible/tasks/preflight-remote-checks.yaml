---
# Un token vacio ya fue descartado por preflight-secrets.yaml; esto valida
# que el PAT efectivamente funciona contra el repo real, no solo que tiene
# forma de token. Corre en localhost, antes de terraform apply, asi que un
# PAT revocado se detecta en segundos en vez de a mitad del bootstrap del
# cluster.
#
# Los tokens de Cloudflare/cloudflared ya no se validan aca - CI no los
# consume (solo Terraform: argocd_github_pat, openbao_static_seal_key).
# scripts/load-secrets-to-openbao.sh valida esos por su cuenta cuando
# corresponda, que es el unico lugar que realmente los usa.

- name: Verificar que el PAT de GitHub tiene acceso al repo de ArgoCD
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ argocd_repo_url | regex_replace('^https://github.com/', '') }}"
    method: GET
    headers:
      Authorization: "token {{ argocd_github_pat }}"
      Accept: "application/vnd.github+json"
    status_code: 200
  no_log: true
