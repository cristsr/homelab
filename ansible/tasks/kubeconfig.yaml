---
- name: Create .kube directory for {{ ansible_user }}
  ansible.builtin.file:
    path: "~{{ ansible_user }}/.kube"
    state: directory
    mode: "0700"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  tags: [kubeconfig]

- name: Export kubeconfig from k0s
  ansible.builtin.command: k0s kubeconfig admin
  register: kubeconfig_out
  changed_when: false
  no_log: true
  tags: [kubeconfig]

- name: Write kubeconfig
  ansible.builtin.copy:
    content: "{{ kubeconfig_out.stdout }}"
    dest: "~{{ ansible_user }}/.kube/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true
  tags: [kubeconfig]

- name: Download kubectl binary {{ kubectl_version }}
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"
    force: false
  tags: [kubeconfig]
