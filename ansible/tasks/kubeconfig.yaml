---
- name: Verificar que Terraform ya genero el kubeconfig
  ansible.builtin.stat:
    path: "{{ kubeconfig_path }}"
  register: kubeconfig_stat
  tags: [kubeconfig]

- name: Fallar si falta el kubeconfig
  ansible.builtin.assert:
    that:
      - kubeconfig_stat.stat.exists
    fail_msg: >-
      No existe {{ kubeconfig_path }} - correr `terraform apply` en
      terraform/infra antes de site.yaml.
    quiet: true
  tags: [kubeconfig]
