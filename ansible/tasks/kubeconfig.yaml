---
# Talos entrega el kubeconfig via el provider de Terraform (talos_cluster_kubeconfig),
# no hay VM a la que conectarse por SSH para extraerlo con `k0s kubeconfig admin`.
- name: Verificar que Terraform ya genero el kubeconfig
  ansible.builtin.stat:
    path: "{{ kubeconfig_path }}"
  register: kubeconfig_stat
  tags: [kubeconfig]

- name: Fallar si falta el kubeconfig
  ansible.builtin.assert:
    that:
      - kubeconfig_stat.stat.exists
    fail_msg: >-
      No existe {{ kubeconfig_path }} - correr `terraform apply` antes de
      site.yaml.
    quiet: true
  tags: [kubeconfig]

- name: Descargar kubectl {{ kubectl_version }}
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"
    force: false
  become: true
  tags: [kubeconfig]
