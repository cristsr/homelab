---
- name: Create .kube directory for {{ ansible_user }}
  ansible.builtin.file:
    path: "~{{ ansible_user }}/.kube"
    state: directory
    mode: "0700"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  tags: [kubeconfig]

- name: Export kubeconfig from k0s
  ansible.builtin.command: k0s kubeconfig admin
  register: kubeconfig_out
  changed_when: false
  no_log: true
  tags: [kubeconfig]

- name: Write kubeconfig
  ansible.builtin.copy:
    content: "{{ kubeconfig_out.stdout }}"
    dest: "~{{ ansible_user }}/.kube/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"
  no_log: true
  tags: [kubeconfig]

- name: Install kubectl wrapper (proxies to k0s kubectl)
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      exec k0s kubectl "$@"
    dest: /usr/local/bin/kubectl
    mode: "0755"
    force: false
  tags: [kubeconfig]
