---
# Corre ANTES de tocar k0scontroller (mientras kubectl/kubeconfig todavia existen).
# OpenEBS Local PV LVM monta los LVs directo en el pod (sin iSCSI/NBD de por medio),
# asi que el drenaje normal de Kubernetes ya es suficiente para que el kubelet
# desmonte todo de forma limpia. La garantia real de "apagado completo" viene del
# paso final (corre siempre, incluso si el drenaje amable de arriba falla o el
# cluster ya estaba inalcanzable): verificar que no queden mounts activos bajo
# /var/lib/kubelet antes de tocar k0scontroller.

- name: Check cluster reachability
  ansible.builtin.command: kubectl get nodes
  register: cluster_check
  become: false
  changed_when: false
  ignore_errors: true
  tags: [teardown]

- name: Set cluster_reachable fact
  ansible.builtin.set_fact:
    cluster_reachable: "{{ cluster_check.rc == 0 }}"
  tags: [teardown]

- name: Cordon node
  ansible.builtin.command: "kubectl cordon {{ inventory_hostname }}"
  become: false
  changed_when: true
  ignore_errors: true
  when: cluster_reachable
  tags: [teardown]

- name: Drain node (evict pods, dispara desmontaje limpio de PVCs)
  ansible.builtin.command: >
    kubectl drain {{ inventory_hostname }}
    --ignore-daemonsets --delete-emptydir-data --force --timeout=180s
  become: false
  changed_when: true
  ignore_errors: true
  when: cluster_reachable
  tags: [teardown]

- name: Check active mounts under kubelet path
  ansible.builtin.shell: >
    set -o pipefail;
    mount | grep -E '/var/lib/(kubelet|k0s)' || true
  register: leftover_mounts
  become: true
  changed_when: false
  tags: [teardown]

- name: Force-unmount any surviving kubelet mounts
  ansible.builtin.command: "umount -l {{ item.split(' ')[2] }}"
  loop: "{{ leftover_mounts.stdout_lines }}"
  become: true
  changed_when: true
  ignore_errors: true
  when: leftover_mounts.stdout_lines | length > 0
  tags: [teardown]
