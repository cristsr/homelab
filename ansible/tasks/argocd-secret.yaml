---
- name: Create argocd namespace
  ansible.builtin.shell: |
    k0s kubectl create namespace argocd --dry-run=client -o yaml | k0s kubectl apply -f -
  become: true
  environment:
    KUBECONFIG: /var/lib/k0s/pki/admin.conf
  changed_when: false
  tags: [argocd]

- name: Create GitHub repo-creds secret for ArgoCD
  ansible.builtin.shell: |
    k0s kubectl apply -f - <<EOF
    apiVersion: v1
    kind: Secret
    metadata:
      name: github-repo-creds
      namespace: argocd
      labels:
        argocd.argoproj.io/secret-type: repo-creds
    stringData:
      type: git
      url: https://github.com/{{ github_username }}
      username: git
      password: "{{ github_token }}"
    EOF
  become: true
  environment:
    KUBECONFIG: /var/lib/k0s/pki/admin.conf
  changed_when: false
  no_log: true
  tags: [argocd]
