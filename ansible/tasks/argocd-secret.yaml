---
- name: Create argocd namespace
  ansible.builtin.shell: |
    kubectl create namespace argocd --dry-run=client -o yaml | k0s kubectl apply -f -
  become: false
  changed_when: false
  tags: [ argocd ]

- name: Create GitHub repo-creds secret for ArgoCD
  ansible.builtin.shell: |
    kubectl apply -f - <<EOF
    apiVersion: v1
    kind: Secret
    metadata:
     name: github-repo-creds
     namespace: argocd
     labels:
       argocd.argoproj.io/secret-type: repo-creds
    stringData:
     type: git
     url: https://github.com/{{ github_username }}
     username: git
     password: "{{ github_token }}"
    EOF
  become: true
  changed_when: false
  no_log: true
  tags: [ argocd ]
