---
- name: Create argocd namespace
  ansible.builtin.shell: |
    kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
  become: false
  changed_when: false
  tags: [ argocd ]

# Defensa en profundidad: protege una corrida manual de site.yaml sin haber
# pasado por preflight.yaml. Sin esto, un PAT vacio crea el secret igual y
# el fallo aparece recien cuando ArgoCD intenta clonar el repo.
- name: Validar que argocd_github_pat no este vacio
  ansible.builtin.assert:
    that:
      - argocd_github_pat | default('') | length > 0
    fail_msg: >-
      argocd_github_pat esta vacio - no se puede crear el secret de
      credenciales de GitHub para ArgoCD.
    quiet: true
  no_log: true
  tags: [ argocd ]

- name: Create GitHub repo-creds secret for ArgoCD
  ansible.builtin.shell: |
    kubectl apply -f - <<EOF
    apiVersion: v1
    kind: Secret
    metadata:
      name: github-repo-creds
      namespace: argocd
      labels:
        argocd.argoproj.io/secret-type: repo-creds
    stringData:
      type: git
      url: https://github.com/{{ argocd_github_username }}
      username: git
      password: "{{ argocd_github_pat }}"
    EOF
  become: false
  changed_when: false
  no_log: true
  tags: [ argocd ]

- name: Create ArgoCD in-cluster secret
  ansible.builtin.shell: |
    CA_DATA=$(kubectl get configmap kube-root-ca.crt -n kube-system -o jsonpath='{.data.ca\.crt}' | base64 -w0)
    kubectl apply -f - <<EOF
    apiVersion: v1
    kind: Secret
    metadata:
      name: in-cluster-secret
      namespace: argocd
      labels:
        argocd.argoproj.io/secret-type: cluster
    type: Opaque
    data:
      server: $(echo -n "https://kubernetes.default.svc" | base64 -w0)
      name: $(echo -n "in-cluster" | base64 -w0)
      config: $(echo -n "{\"tlsClientConfig\":{\"insecure\":false,\"caData\":\"${CA_DATA}\"}}" | base64 -w0)
    EOF
  become: false
  changed_when: false
  tags: [ argocd ]

# Sin esto, ArgoCD queda instalado pero sin ninguna Application registrada:
# el resto del stack (gitops/apps/**) nunca se sincroniza.
- name: Apply the app-of-apps root Application
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../gitops/root-app.yaml"
    dest: /tmp/root-app.yaml
    mode: "0644"
  tags: [ argocd ]

- name: Register the root Application in ArgoCD
  ansible.builtin.shell: |
    kubectl apply -f /tmp/root-app.yaml
  become: false
  changed_when: false
  tags: [ argocd ]
