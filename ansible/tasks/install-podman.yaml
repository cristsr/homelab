# Shared Podman install plus the auto-update timer, included by data-services.yaml.
---
- name: Install Podman
  ansible.builtin.apt:
    name: podman
    state: present
    update_cache: true

- name: Enable and start the Podman auto-update timer
  ansible.builtin.systemd:
    name: podman-auto-update.timer
    enabled: true
    state: started
