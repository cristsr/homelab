---
# Runs before any other playbook: validates the credentials Terraform/ArgoCD
# need for this pipeline, so a missing or invalid one fails fast instead of
# mid-bootstrap.
- name: Preflight - validate credentials before provisioning infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  # default(x, true) also covers an empty string, not just an undefined var.
  vars:
    argocd_repo_url: "{{ lookup('env', 'ARGOCD_REPO_URL') | default('https://github.com/cristsr/homelab', true) }}"
    argocd_github_pat: "{{ lookup('env', 'ARGOCD_GITHUB_PAT') }}"

  tasks:
    - import_tasks: tasks/preflight-secrets.yaml
    - import_tasks: tasks/preflight-remote-checks.yaml
