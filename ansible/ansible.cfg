[defaults]
inventory = inventory.yaml
host_key_checking = false
callbacks_enabled = timer, profile_tasks
gathering = smart
fact_caching = memory
stdout_callback = ansible.builtin.default
bin_ansible_callbacks = True

[ssh_connection]
# Red de seguridad adicional a los ServerAlive* de inventory.yaml.tftpl (que
# cubren el salto al hipervisor y el proxy a la VM): timeout de conexion
# inicial acotado en vez del default (que puede colgar indefinidamente si
# la ruta de red esta en un estado raro en vez de fallar limpio).
timeout = 30

[privilege_escalation]
become = true
become_method = sudo

[callback_default]
result_format = yaml
