[defaults]
inventory = inventory.yaml
host_key_checking = false
callbacks_enabled = timer, profile_tasks
gathering = smart
fact_caching = memory
stdout_callback = ansible.builtin.default
bin_ansible_callbacks = True

[ssh_connection]
# Extra safety net on top of the ServerAlive* settings in inventory.yaml.tftpl
# (which cover the hop to the hypervisor and the proxy to the VM): a bounded
# initial connection timeout instead of the default (which can hang
# indefinitely if the network path is in a weird state instead of failing clean).
timeout = 30

[privilege_escalation]
become = true
become_method = sudo

[callback_default]
result_format = yaml
