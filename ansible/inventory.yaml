# Talos has no SSH or shell: everything runs on localhost via the generated
# kubeconfig. The data LXCs do have SSH - the groups below target them.
all:
  hosts:
    localhost:
      ansible_connection: local
  children:
    proxmox:
      hosts:
        proxmox-host:
          ansible_host: 192.168.80.20
          ansible_user: "{{ proxmox_ssh_user }}"
          ansible_ssh_private_key_file: "{{ proxmox_ssh_private_key_file }}"
    data_lxcs:
      hosts:
        postgresql:
          ansible_host: 10.10.20.31
          pct_vmid: 121
        mongodb:
          ansible_host: 10.10.20.20
          pct_vmid: 122
        qdrant:
          ansible_host: 10.10.20.30
          pct_vmid: 123
        redis:
          ansible_host: 10.10.20.40
          pct_vmid: 124
        mysql:
          ansible_host: 10.10.20.50
          pct_vmid: 125
      vars:
        ansible_user: root
