# Kubeconfig/talosconfig generados por `terraform apply` en terraform/infra
# (resources local_file.kubeconfig / local_file.talosconfig).
kubeconfig_path: "{{ playbook_dir }}/../terraform/infra/generated/kubeconfig"
talosconfig_path: "{{ playbook_dir }}/../terraform/infra/generated/talosconfig"

# Nombre del nodo Talos en Kubernetes (= var.vm_name en terraform), usado por
# tasks/openebs-zfs-prereqs.yaml para el `kubectl debug node/<nombre>`.
talos_node_name: homelab

# IPs fijas asignadas via Cilium L2 Announcements (spec.addresses en el
# Gateway `main`, ver platform/networking/cilium-gateway/), ahora en la LAN
# real (vmbr0 bridged en Proxmox, ya no NAT de libvirt) - deben ser IPs
# libres dentro de la misma subred que var.vm_static_ip en terraform.
cilium_gateway_lb_ip: 192.168.80.240
private_dns_ip: 192.168.80.253
k0s_pod_cidr: 10.244.0.0/16
k0s_service_cidr: 10.96.0.0/12

# Pool ZFS para OpenEBS ZFS LocalPV, creado por
# ansible/tasks/openebs-zfs-prereqs.yaml sobre el disco dedicado (virtio1 en
# terraform/infra/proxmox.tf) - misma fuente de verdad usada por el
# StorageClass en platform/storage/openebs/storageclass.yaml.
openebs_zfs_pool_name: zfspv-pool

