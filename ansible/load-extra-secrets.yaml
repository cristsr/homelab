---
- name: Load extra secrets into OpenBao KV
  hosts: k0s
  become: true

  vars:
    bao_url: "http://127.0.0.1:8200"
    pf_pid_file: "/tmp/openbao-pf-extra.pid"

  tasks:
    - name: Check that extra-secrets.yaml exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/extra-secrets.yaml"
      register: extra_secrets_file

    - name: Fail if extra-secrets.yaml does not exist
      ansible.builtin.fail:
        msg: |
          extra-secrets.yaml not found in {{ playbook_dir }}.
          Copy extra-secrets.yaml.example and fill in your secrets:
            cp extra-secrets.yaml.example extra-secrets.yaml
      when: not extra_secrets_file.stat.exists

    - name: Include extra secrets
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/extra-secrets.yaml"

    - name: Validate openbao_extra_secrets is defined and not empty
      ansible.builtin.fail:
        msg: "Variable 'openbao_extra_secrets' is not defined or is empty in extra-secrets.yaml"
      when: >
        openbao_extra_secrets is not defined or
        openbao_extra_secrets | length == 0

    - name: Check if openbao-init job exists
      ansible.builtin.shell: |
        kubectl get job openbao-init -n secret-management -o name 2>/dev/null || true
      register: init_job
      become: false
      changed_when: false

    - name: Wait for openbao-init job to complete
      ansible.builtin.shell: |
        kubectl wait --for=condition=complete job/openbao-init \
          -n secret-management --timeout=300s
      become: false
      changed_when: false
      when: init_job.stdout | length > 0

    - name: Read root token from cluster
      ansible.builtin.shell: |
        kubectl get secret openbao-root-token -n secret-management \
          -o jsonpath='{.data.token}' | base64 -d
      register: bao_root_token
      become: false
      no_log: true
      changed_when: false

    - name: Start port-forward to OpenBao
      ansible.builtin.shell: |
        kubectl port-forward svc/openbao 8200:8200 -n secret-management \
          > /tmp/openbao-pf-extra.log 2>&1 &
        echo $! > {{ pf_pid_file }}
        sleep 2
      become: false
      changed_when: false

    - name: Wait for OpenBao to be reachable
      ansible.builtin.uri:
        url: "{{ bao_url }}/v1/sys/health"
        method: GET
        status_code: 200
      register: bao_health
      until: bao_health.status == 200
      retries: 30
      delay: 2
      become: false

    - block:
        - name: Write extra secrets to OpenBao KV
          ansible.builtin.uri:
            url: "{{ bao_url }}/v1/secret/data/{{ item.path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ bao_root_token.stdout }}"
            body_format: json
            body:
              data: "{{ item.data }}"
            status_code: 200
          loop: "{{ openbao_extra_secrets }}"
          no_log: true

      always:
        - name: Stop port-forward
          ansible.builtin.shell: |
            kill $(cat {{ pf_pid_file }}) 2>/dev/null || true
            rm -f {{ pf_pid_file }} /tmp/openbao-pf-extra.log
          become: false
          changed_when: false
