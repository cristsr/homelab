---
- name: Teardown k0s cluster
  hosts: k0s
  become: true

  vars_prompt:
    - name: confirm
      prompt: "This will destroy the cluster completely. Type 'yes' to continue"
      private: false

  tasks:
    - name: Abort if not confirmed
      ansible.builtin.fail:
        msg: "Teardown cancelled"
      when: confirm != "yes"

    - import_tasks: tasks/graceful-shutdown.yaml

    - name: Stop k0s
      ansible.builtin.systemd:
        name: k0scontroller
        state: stopped
      ignore_errors: true

    - name: Reset k0s (removes etcd, certs, PVs, systemd unit)
      ansible.builtin.command: k0s reset
      async: 120
      poll: 5
      register: k0s_reset_result
      ignore_errors: true

    - name: Warn if k0s reset timed out or failed
      ansible.builtin.debug:
        msg: >-
          k0s reset no termino limpio en 120s (posible cuelgue por mounts
          huerfanos) - se continua igual con la limpieza manual de
          procesos/mounts/directorios abajo.
      when: k0s_reset_result.failed | default(false)

    - name: Check for surviving k0s/containerd processes
      ansible.builtin.shell: >
        set -o pipefail;
        pgrep -af 'k0scontroller|containerd-shim' || true
      register: leftover_processes
      changed_when: false

    - name: Kill surviving k0s/containerd processes
      ansible.builtin.command: pkill -9 -f '{{ item }}'
      loop:
        - k0scontroller
        - containerd-shim
      ignore_errors: true
      when: leftover_processes.stdout | length > 0

    - name: Re-check for leftover mounts before removing data directories
      ansible.builtin.shell: >
        set -o pipefail;
        mount | grep -E '/var/lib/(kubelet|k0s)' || true
      register: final_leftover_mounts
      changed_when: false

    - name: Force-unmount any leftover mounts before removing data directories
      ansible.builtin.command: "umount -l {{ item.split(' ')[2] }}"
      loop: "{{ final_leftover_mounts.stdout_lines }}"
      ignore_errors: true
      when: final_leftover_mounts.stdout_lines | length > 0

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Remove k0s binaries
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/k0s
        - /usr/local/bin/kubectl
        - /usr/local/bin/helm
        - /usr/local/bin/helmfile

    - name: Remove k0s configuration
      ansible.builtin.file:
        path: /etc/k0s/k0s.yaml
        state: absent

    - name: Remove kubeconfig for user
      ansible.builtin.file:
        path: "~{{ ansible_user }}/.kube/config"
        state: absent

    - name: Remove k0s data directory
      ansible.builtin.file:
        path: /var/lib/k0s
        state: absent

    # Se borran solo los LVs (datos de los PVCs) y se deja el VG/PV intactos:
    # asi ansible/tasks/openebs-prereqs.yaml no tiene que recrearlos en el
    # proximo site.yaml (es idempotente y los detecta ya creados).
    - name: List logical volumes in the OpenEBS Volume Group
      ansible.builtin.command: >
        lvs --noheadings -o lv_name {{ openebs_lvm_vg_name }}
      register: openebs_lvs
      changed_when: false
      failed_when: false

    - name: Remove logical volumes in the OpenEBS Volume Group
      ansible.builtin.command: "lvremove -f {{ openebs_lvm_vg_name }}/{{ item | trim }}"
      loop: "{{ openebs_lvs.stdout_lines | default([]) }}"
      when: openebs_lvs.rc == 0 and (item | trim | length > 0)
