---
- name: Populate OpenBao KV
  hosts: k0s
  become: true

  vars:
    bao_url: "http://127.0.0.1:8200"

  tasks:
    - name: Wait for openbao Service to have a ready endpoint
      ansible.builtin.shell: |
        kubectl get endpoints openbao -n secret-management \
          -o jsonpath='{.subsets[*].addresses}' 2>/dev/null
      register: openbao_endpoints
      until: openbao_endpoints.stdout | length > 0
      retries: 60
      delay: 10
      become: false
      changed_when: false

    - name: Wait for openbao-init job to exist
      ansible.builtin.shell: |
        kubectl get job openbao-init -n secret-management -o name 2>/dev/null || true
      register: init_job
      until: init_job.stdout | length > 0
      retries: 30
      delay: 10
      become: false
      changed_when: false

    - name: Wait for openbao-init job to complete
      ansible.builtin.shell: |
        kubectl wait --for=condition=complete job/openbao-init \
          -n secret-management --timeout=300s
      become: false
      changed_when: false
      when: init_job.stdout | length > 0

    - name: Read root token from cluster
      ansible.builtin.shell: |
        kubectl get secret openbao-root-token -n secret-management \
          -o jsonpath='{.data.token}' | base64 -d
      register: bao_root_token
      become: false
      no_log: true
      changed_when: false

    - name: Validar que las credenciales de infraestructura no esten vacias
      ansible.builtin.assert:
        that:
          - item.value | length > 0
        fail_msg: >-
          "{{ item.name }}" esta vacia - no se escribira en OpenBao. Corre
          `ansible-playbook preflight.yaml` para diagnosticar la causa.
        quiet: true
      loop:
        - { name: argocd_github_pat, value: "{{ argocd_github_pat }}" }
        - { name: argocd_repo_url, value: "{{ argocd_repo_url }}" }
        - { name: argocd_webhook_secret, value: "{{ argocd_webhook_secret }}" }
        - { name: cloudflare_api_token, value: "{{ cloudflare_api_token }}" }
        - { name: cloudflared_token, value: "{{ cloudflared_token }}" }
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Escribir secretos de infraestructura en OpenBao
      ansible.builtin.import_tasks: tasks/openbao-kv-write.yaml
      vars:
        openbao_root_token: "{{ bao_root_token.stdout }}"
        openbao_pf_pid_file: "/tmp/openbao-pf.pid"
        openbao_secrets_to_write:
          - path: argocd
            data:
              github_pat: "{{ argocd_github_pat }}"
              username: "x-access-token"
              url: "{{ argocd_repo_url }}"
              webhook_secret: "{{ argocd_webhook_secret }}"
          - path: infra/cloudflare
            data:
              api_token: "{{ cloudflare_api_token }}"
          - path: infra/cloudflared
            data:
              token: "{{ cloudflared_token }}"

    - name: Check if cloudflared deployment exists
      ansible.builtin.shell: |
        kubectl get deployment cloudflared -n networking -o name 2>/dev/null || true
      register: cloudflared_deploy
      become: false
      changed_when: false

    - name: Wait for ExternalSecret to sync the new cloudflared token
      ansible.builtin.shell: |
        kubectl get secret cloudflared-token -n networking \
          -o jsonpath='{.data.token}' 2>/dev/null | base64 -d
      register: synced_token
      until: synced_token.stdout == cloudflared_token
      retries: 20
      delay: 5
      become: false
      no_log: true
      changed_when: false
      when: cloudflared_deploy.stdout | length > 0

    - name: Restart cloudflared deployment to pick up new token
      ansible.builtin.shell: |
        kubectl rollout restart deployment/cloudflared -n networking
      become: false
      changed_when: true
      when: cloudflared_deploy.stdout | length > 0
