apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaneo
  namespace: kaneo
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kaneo
  template:
    metadata:
      labels:
        app: kaneo
    spec:
      containers:
        - name: kaneo
          image: ghcr.io/usekaneo/kaneo:2.36.0
          ports:
            - containerPort: 5173
          env:
            - name: KANEO_CLIENT_URL
              value: https://kaneo.internal.cristianpuenguenan.online
            # Sign-up stays closed from the first start. Kaneo still lets the
            # first non-guest user complete the instance setup, so the owner
            # creates the account once at the first visit.
            - name: DISABLE_REGISTRATION
              value: "true"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: kaneo-app-secret
                  key: auth-secret
            - name: POSTGRES_HOST
              value: postgres.internal.cristianpuenguenan.online
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: kaneo
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: kaneo-app-secret
                  key: db-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kaneo-app-secret
                  key: db-password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kaneo
  namespace: kaneo
spec:
  selector:
    app: kaneo
  ports:
    - port: 80
      targetPort: 5173
  type: ClusterIP
