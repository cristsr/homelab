apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: media
data:
  recyclarr.yml: |
    # TRaSH Guides profiles, taken from the official recyclarr config-templates.
    # Tuned for the main viewing PC (RTX 3080, 1440p): it decodes HEVC in hardware,
    # so x265 is allowed (smaller files, direct play, no CPU transcode on the
    # GPU-less node). 1080p only: a 1440p screen gains little from 2160p and a
    # 4K/Remux library would not fit the ~900Gi volume. preferred_ratio 0.5 puts
    # the size target halfway between the guide's min and max.
    # reset_unmatched_scores keeps the profile scores identical to the guide.
    radarr:
      hd-bluray-web:
        base_url: http://radarr.media.svc:7878
        api_key: !env_var RADARR_API_KEY
        quality_definition:
          type: movie
          preferred_ratio: 0.5
        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
        custom_format_groups:
          add:
            - trash_id: f8bf8eab4617f12dfdbd16303d8da245 # [Optional] Golden Rule HD
              exclude:
                - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
              select:
                - 839bea857ed2c0a8e084f3cbdbd65ecb # x265 (no HDR/DV)
            - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # [Unwanted] Unwanted Formats
    # Sonarr uses hand-declared profiles (not TRaSH's WEB-only ones): the anime
    # library comes mostly from Bluray/HDTV, which WEB-1080p would reject. Recyclarr
    # owns the qualities and upgrade rules; TRaSH only supplies the [Unwanted] scores.
    # "Subs Español" is a CF made by hand in Sonarr (not in the guide), scored +1000 in
    # both profiles; until_score 1000 stops upgrades once a release carries it.
    sonarr:
      anime:
        base_url: http://sonarr.media.svc:8989
        api_key: !env_var SONARR_API_KEY
        quality_definition:
          type: series
          preferred_ratio: 0.5
        quality_profiles:
          # TRaSH anime profile (SeaDex-based group tiers, v0-v4, raws/LQ penalties).
          # min_format_score 0: its default 100 would reject groups outside the tier
          # lists. "Subs Español" / "Spanish (Latino)" are scored by hand on it, and
          # so is "Dubs Only" (-10000 in the guide; overriding it here conflicts).
          - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
            min_format_score: 0
            # Same qualities as the guide minus Remux: too big for the ~900Gi volume
            # and indistinguishable from Bluray on a 1440p screen.
            upgrade:
              allowed: true
              until_quality: Bluray-1080p
            qualities:
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p
                  - HDTV-1080p
              - name: Bluray-720p
              - name: WEB 720p
                qualities:
                  - WEBDL-720p
                  - WEBRip-720p
                  - HDTV-720p
              - name: Bluray-480p
              - name: WEB 480p
                qualities:
                  - WEBDL-480p
                  - WEBRip-480p
              - name: DVD
              - name: SDTV
          - name: HD-1080p
            upgrade:
              allowed: true
              until_quality: Bluray-1080p
              until_score: 1000
            qualities:
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p
              - name: HDTV-1080p
          - name: HD-720p
            upgrade:
              allowed: true
              until_quality: Bluray-720p
              until_score: 1000
            qualities:
              - name: Bluray-720p
              - name: WEB 720p
                qualities:
                  - WEBDL-720p
                  - WEBRip-720p
              - name: HDTV-720p
        custom_format_groups:
          add:
            - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats
              assign_scores_to:
                - name: HD-1080p
                - name: HD-720p
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: media
spec:
  # TRaSH updates its scores a few times a week; daily keeps Radarr/Sonarr current.
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.8.1
              args: ["sync"]
              envFrom:
                - secretRef:
                    name: recyclarr-api-keys
              env:
                - name: RECYCLARR_CONFIG_DIR
                  value: /config
              volumeMounts:
                # Recyclarr 8 creates state/ and its guide cache under the config dir,
                # so that dir is writable scratch and only the file comes from the ConfigMap.
                - name: scratch
                  mountPath: /config
                - name: config
                  mountPath: /config/recyclarr.yml
                  subPath: recyclarr.yml
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: scratch
              emptyDir: {}
            - name: config
              configMap:
                name: recyclarr-config
