# El admission del cluster aplica PodSecurity baseline por defecto en
# namespaces sin labels (ver platform/storage/openebs/namespace.yaml
# para el mismo patron), y el init container `init-sysctl` del chart de
# SonarQube necesita `securityContext.privileged: true` para subir
# `vm.max_map_count` (requisito de Elasticsearch, el motor de busqueda
# embebido). Sin este label el StatefulSet queda en FailedCreate eterno:
# "violates PodSecurity baseline:latest".
apiVersion: v1
kind: Namespace
metadata:
  name: sonarqube
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
