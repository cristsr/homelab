# The `init-sysctl` init container needs privileged access to raise
# vm.max_map_count, required by the bundled Elasticsearch.
apiVersion: v1
kind: Namespace
metadata:
  name: sonarqube
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
