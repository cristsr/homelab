apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-sonarqube
  namespace: sonarqube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-sonarqube
  template:
    metadata:
      labels:
        app: mcp-sonarqube
    spec:
      containers:
        - name: mcp-sonarqube
          image: docker.io/mcp/sonarqube:latest@sha256:925c88bc7cab2a1e1025b0bd43f0af504cd8ce1b99e9663ececaca914fb632e7
          ports:
            - containerPort: 3000
          env:
            - name: SONARQUBE_TRANSPORT
              value: "http"
            - name: SONARQUBE_HTTP_HOST
              value: "0.0.0.0"
            - name: SONARQUBE_HTTP_PORT
              value: "3000"
            - name: SONARQUBE_URL
              value: "http://sonarqube-sonarqube.sonarqube.svc.cluster.local:9000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-sonarqube
  namespace: sonarqube
spec:
  selector:
    app: mcp-sonarqube
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
