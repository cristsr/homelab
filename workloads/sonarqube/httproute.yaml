apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  parentRefs:
    - name: main
      namespace: networking
      sectionName: https
  hostnames:
    - sonarqube.internal.cristianpuenguenan.online
  rules:
    # KubeElasti's resolver reads the target service from Host, so it is rewritten
    # to the service FQDN (see platform/networking/elasti/elasti.yaml).
    - filters:
        - type: URLRewrite
          urlRewrite:
            hostname: sonarqube-sonarqube.sonarqube.svc.cluster.local
      backendRefs:
        - name: sonarqube-sonarqube
          port: 9000
