community:
  enabled: true

monitoringPasscodeSecretName: sonarqube-monitoring-secret
monitoringPasscodeSecretKey: passcode

deploymentAnnotations:
  reloader.stakater.com/auto: "true"

persistence:
  enabled: true
  storageClass: openebs-zfs
  size: 10Gi

postgresql:
  enabled: false

jdbcOverwrite:
  enable: false

env:
  # IP directa de la LXC, no el hostname *.internal - ese solo lo sirve
  # `private-dns` a clientes Tailscale (Split DNS), CoreDNS del cluster no
  # lo conoce y lo resuelve por DNS publico (Cloudflare, wildcard
  # *.cristianpuenguenan.online) - conecta a una IP de Cloudflare que no
  # escucha en :5432, "Connect timed out" eterno. Ver docs/DECISIONS.md.
  - name: SONAR_JDBC_URL
    value: "jdbc:postgresql://192.168.80.31:5432/sonarqube"
  - name: SONAR_JDBC_USERNAME
    valueFrom:
      secretKeyRef:
        name: sonarqube-db-secret
        key: username
  - name: SONAR_JDBC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: sonarqube-db-secret
        key: password

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: false

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi
