community:
  enabled: true

monitoringPasscode: "homelab"

deploymentAnnotations:
  reloader.stakater.com/auto: "true"

persistence:
  enabled: true
  storageClass: openebs-zfs
  size: 10Gi

postgresql:
  enabled: false

jdbcOverwrite:
  enable: false

env:
  - name: SONAR_JDBC_URL
    value: "jdbc:postgresql://sonarqube-db-rw.sonarqube.svc.cluster.local:5432/sonarqube"
  - name: SONAR_JDBC_USERNAME
    valueFrom:
      secretKeyRef:
        name: sonarqube-db-secret
        key: username
  - name: SONAR_JDBC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: sonarqube-db-secret
        key: password

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: false

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi
