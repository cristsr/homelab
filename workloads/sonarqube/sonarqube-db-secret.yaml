apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-db-secret
  namespace: sonarqube
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: sonarqube-db-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: sonarqube-db-credentials/username
    - secretKey: password
      remoteRef:
        key: sonarqube-db-credentials/password
