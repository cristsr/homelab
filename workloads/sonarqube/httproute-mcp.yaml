apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-sonarqube
  namespace: sonarqube
spec:
  parentRefs:
    - name: main
      namespace: networking
      sectionName: https
  hostnames:
    - mcp.internal.cristianpuenguenan.online
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /sonarqube
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: mcp-sonarqube
          port: 3000
