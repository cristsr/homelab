apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-sonarqube
  namespace: sonarqube
spec:
  parentRefs:
    - name: main
      namespace: networking
      sectionName: https
  hostnames:
    - sonarqube.internal.cristianpuenguenan.online
  rules:
    # Same host as the UI route; the longer /mcp prefix wins over its catch-all.
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: mcp-sonarqube
          port: 3000
