# MCP clients hold SSE / Streamable HTTP streams open; Envoy's default 15s route
# timeout would cut them, so the per-request timeout is disabled for this route.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: mcp-sonarqube
  namespace: sonarqube
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: mcp-sonarqube
  timeout:
    http:
      requestTimeout: 0s
      connectionIdleTimeout: 1h
