apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sonarqube-db-default-deny
  namespace: sonarqube
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: sonarqube-db
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: sonarqube
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  egress: []
