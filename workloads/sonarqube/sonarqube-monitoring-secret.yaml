apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-monitoring-secret
  namespace: sonarqube
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: sonarqube-monitoring-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: passcode
      remoteRef:
        key: sonarqube/monitoring
        property: passcode
