# Creates the tasks of the Kaneo templates on their fixed dates (Kaneo only repeats a
# task when it is completed). The app is the `nexus` app of github.com/cristsr/task-manager,
# which also carries the Notion integrations of its past life: they stay idle here, since this
# deployment has no Notion token, and only log a failed call at start. The repo builds and
# publishes the image; this file is the only place that says where and how it runs.
# It cannot sit at zero replicas: its schedulers have to be running when they fire.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  namespace: kaneo
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Two pods at once would run every scheduler twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: nexus
          # `develop` is the moving tag the image workflow of the repo publishes; Renovate keeps the
          # digest current and opens a PR when it changes, see docs/nexus.md.
          image: ghcr.io/cristsr/task-manager:develop@sha256:9fcaab8ea2a9b153065c2f4b173da4e57558cbce132f8db276c34ca44928a3af
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: TIME_ZONE
              value: America/Bogota
            - name: KANEO_URL
              value: http://kaneo.kaneo.svc.cluster.local
            # Ids of the projects, not secrets.
            - name: KANEO_DAILY_PROJECT_ID
              value: cqhbh2oj1vkig1ek0ajcm25y
            - name: KANEO_TEMPLATE_PROJECT_ID
              value: haskg6j7dyn6ceon5rt7nqtr
            - name: KANEO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: kaneo-api-key
            - name: MONGO_DB_URI
              valueFrom:
                secretKeyRef:
                  name: nexus-secrets
                  key: mongo-uri
            - name: MONGO_DB_NAME
              value: nexus
            # The app starts a local LokiDB file whatever it is used for; the root filesystem is read only.
            - name: LOKI_DB_NAME
              value: /tmp/database.json
            - name: I18N_DEFAULT_LANG
              value: es
            - name: I18N_FALLBACK_LANG
              value: es
            - name: NOTIFICATION_PROVIDER
              value: PUSHOVER
            - name: NOTIFICATION_TTL
              value: "3600"
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: 3000
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: 3000
            initialDelaySeconds: 60
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
      volumes:
        - name: tmp
          emptyDir: {}
