# Application configuration lives on the retaining class: a claim recreated by
# a manifest change or a namespace rebuild must not take the app's settings with
# it. The library gets the media disk instead, and every app that imports into
# it mounts this claim at the same path so a move stays within one filesystem.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: media
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: openebs-zfs-retain
  resources:
    requests:
      storage: 1Gi
---
