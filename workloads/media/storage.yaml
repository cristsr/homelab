# Scratch space, not configuration: it is rebuilt on demand, so it uses a
# deleting class instead of the retaining one. It sits on the media disk, not the
# SSD: that disk is slower, but it is a separate virtual disk, so a transcode no
# longer shares I/O with etcd and the rest of the control plane on the system disk.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-transcodes
  namespace: media
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: openebs-zfs-media
  resources:
    requests:
      storage: 20Gi
