---
# Size this to the library you intend to keep: it holds every download and every
# imported file, and ZFS expansion is the only way to grow it after the fact.
# It has to stay within the pool terraform sizes from media_disk_size_gb, or the
# claim never binds.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: media
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: openebs-zfs-media
  resources:
    requests:
      storage: 900Gi
