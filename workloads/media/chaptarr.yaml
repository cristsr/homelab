apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaptarr
  namespace: media
spec:
  replicas: 1
  # RollingUpdate would create the new pod before the old one releases its
  # ReadWriteOnce volumes, leaving it stuck FailedMount. Recreate tears the
  # old pod down first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chaptarr
  template:
    metadata:
      labels:
        app: chaptarr
    spec:
      # fsGroup re-groups the whole media-library volume every time this pod
      # starts, so it has to match the group the rest of the stack uses (911);
      # any other value strips write access from radarr/sonarr/jellyfin.
      securityContext:
        fsGroup: 911
      containers:
        - name: chaptarr
          # Readarr was retired upstream (2026-06-27); Chaptarr is the
          # maintained community fork. No official linuxserver.io image and
          # no semver tags published yet, only :latest.
          image: chaptarr/chaptarr:0.9.911
          # The image drops to "abc" (99:100 unless told otherwise), which can't
          # write the library; run it as the same uid/gid as the other arrs.
          env:
            - name: PUID
              value: "911"
            - name: PGID
              value: "911"
          ports:
            - containerPort: 8789
          volumeMounts:
            - name: config
              mountPath: /config
            # Same mount path as the rest of the stack: an import is a move or
            # a hardlink, never a copy across volumes.
            - name: library
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: chaptarr-config
        - name: library
          persistentVolumeClaim:
            claimName: media-library
---
apiVersion: v1
kind: Service
metadata:
  name: chaptarr
  namespace: media
spec:
  selector:
    app: chaptarr
  ports:
    - port: 8789
      targetPort: 8789
  type: ClusterIP
