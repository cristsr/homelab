# The VPN sidecar needs NET_ADMIN to manage the tunnel interface and its
# kill-switch rules, which the baseline PodSecurity profile refuses, so this
# Namespace carries the privileged labels the other namespaces with the same
# need use.
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
