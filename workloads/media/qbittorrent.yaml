apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
spec:
  replicas: 1
  # RollingUpdate would create the new pod before the old one releases its
  # ReadWriteOnce volumes, leaving it stuck FailedMount. Recreate tears the
  # old pod down first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      # linuxserver.io images run as uid/gid 911 ("abc"); the shared library
      # volume isn't auto-chowned like /config, so grant group write via fsGroup.
      securityContext:
        fsGroup: 911
      containers:
        # Owns the pod's network namespace, which qBittorrent joins: a dropped
        # tunnel leaves the client with no route out instead of the cluster's
        # own address. Its firewall admits the WebUI port, so the Service still
        # reaches it through the tunnel. Only WIREGUARD_PRIVATE_KEY (and an
        # optional SERVER_COUNTRIES) comes from the secret; the rest is here.
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.3
          envFrom:
            - secretRef:
                name: qbittorrent-vpn
          env:
            - name: VPN_SERVICE_PROVIDER
              value: protonvpn
            - name: VPN_TYPE
              value: wireguard
            - name: VPN_PORT_FORWARDING
              value: "on"
            # Only servers that support port forwarding (ProtonVPN P2P).
            - name: PORT_FORWARD_ONLY
              value: "on"
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            # Runs on every forwarded port, so qBittorrent's listening port
            # follows ProtonVPN's assignment. Needs "Bypass authentication for
            # clients on localhost" enabled in qBittorrent's WebUI settings.
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: >-
                /bin/sh -c 'wget -O- --retry-connrefused --post-data
                "json={\"listen_port\":{{PORTS}},\"current_network_interface\":\"{{VPN_INTERFACE}}\"}"
                http://127.0.0.1:8080/api/v2/app/setPreferences'
          ports:
            - containerPort: 8080
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
        - name: qbittorrent
          image: linuxserver/qbittorrent:5.2.3_v2.0.14-ls476
          volumeMounts:
            - name: config
              mountPath: /config
            # Same mount path as the rest of the stack: an import is a move or
            # a hardlink, never a copy across volumes.
            - name: library
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: library
          persistentVolumeClaim:
            claimName: media-library
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media
spec:
  selector:
    app: qbittorrent
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
