apiVersion: apps/v1
kind: Deployment
metadata:
  name: overseerr
  namespace: media
spec:
  replicas: 1
  # RollingUpdate would create the new pod before the old one releases its
  # ReadWriteOnce volumes, leaving it stuck FailedMount. Recreate tears the
  # old pod down first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: overseerr
  template:
    metadata:
      labels:
        app: overseerr
    spec:
      # Seerr runs as the node user (uid 1000), unlike the previous images on
      # this claim; without fsGroup it can't write /app/config/logs.
      securityContext:
        fsGroup: 1000
      containers:
        - name: overseerr
          # Jellyseerr (fallenbagel) is archived, superseded by Seerr, the
          # maintained fork. Pinned to :latest deliberately, not a version tag:
          # ghcr.io publishes no semver tags, only latest + commit shas, and the
          # Jellyfin 12 auth fix (PR #3502, merged 2026-09-12) is only there.
          # Re-pin to the matching sha- tag once confirmed working.
          image: ghcr.io/seerr-team/seerr:v3.5.0
          ports:
            - containerPort: 5055
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              cpu: 250m
              memory: 768Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: overseerr-config
---
apiVersion: v1
kind: Service
metadata:
  name: overseerr
  namespace: media
spec:
  selector:
    app: overseerr
  ports:
    - port: 5055
      targetPort: 5055
  type: ClusterIP
