apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: media
spec:
  parentRefs:
    - name: main
      namespace: networking
      sectionName: https
  hostnames:
    - sonarr.internal.cristianpuenguenan.online
  rules:
    - backendRefs:
        - name: sonarr
          port: 8989
---
