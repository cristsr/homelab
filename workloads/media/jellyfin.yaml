apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  # RollingUpdate would create the new pod before the old one releases its
  # ReadWriteOnce volumes, leaving it stuck FailedMount. Recreate tears the
  # old pod down first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      # linuxserver.io images run as uid/gid 911 ("abc"); the shared library
      # volume isn't auto-chowned like /config, so grant group write via fsGroup.
      securityContext:
        fsGroup: 911
      # The nvidia runtime is what mounts the driver libraries into the
      # container; the device plugin only hands out the card.
      runtimeClassName: nvidia
      containers:
        - name: jellyfin
          image: linuxserver/jellyfin:12.1ubu2604-ls50
          ports:
            - containerPort: 8096
          env:
            # video: NVENC/NVDEC. The plugin sets NVIDIA_VISIBLE_DEVICES itself.
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,video,utility
          volumeMounts:
            - name: config
              mountPath: /config
            # Same mount path as the rest of the stack: an import is a move or
            # a hardlink, never a copy across volumes.
            - name: library
              mountPath: /data
            # Transcodes can grow to several GB per session. Their own volume
            # keeps them off the config volume, where a full disk breaks
            # Jellyfin's SQLite database (and every login). It lives on the
            # media disk so the churn stays away from the system disk etcd runs on.
            - name: transcodes
              mountPath: /config/cache/transcodes
          # Encoding and decoding run on the GPU (enable NVENC/NVDEC in
          # Jellyfin's transcoding settings); the CPU limit now only covers the
          # demuxer, audio and burned-in subtitles.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
              nvidia.com/gpu: 1
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: library
          persistentVolumeClaim:
            claimName: media-library
        - name: transcodes
          persistentVolumeClaim:
            claimName: jellyfin-transcodes
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  selector:
    app: jellyfin
  ports:
    - port: 8096
      targetPort: 8096
  type: ClusterIP
