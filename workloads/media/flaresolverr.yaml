apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      containers:
        # Byparr speaks FlareSolverr's API, so the name and Service stay as is
        # and Prowlarr keeps its FlareSolverr proxy. FlareSolverr 3.3.21 (Chromium
        # 120) timed out on Cloudflare's challenge for 1337x.
        - name: flaresolverr
          image: ghcr.io/thephaseless/byparr:3.0.4
          ports:
            - containerPort: 8191
          env:
            - name: LOG_LEVEL
              value: info
            - name: PORT
              value: "8191"
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: media
spec:
  selector:
    app: flaresolverr
  ports:
    - port: 8191
      targetPort: 8191
  type: ClusterIP
