apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
spec:
  replicas: 1
  # RollingUpdate would create the new pod before the old one releases its
  # ReadWriteOnce volumes, leaving it stuck FailedMount. Recreate tears the
  # old pod down first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      # linuxserver.io images run as uid/gid 911 ("abc"); the shared library
      # volume isn't auto-chowned like /config, so grant group write via fsGroup.
      securityContext:
        fsGroup: 911
      containers:
        - name: sonarr
          image: linuxserver/sonarr:4.0.20.3014-ls325
          ports:
            - containerPort: 8989
          volumeMounts:
            - name: config
              mountPath: /config
            # Same mount path as the rest of the stack: an import is a move or
            # a hardlink, never a copy across volumes.
            - name: library
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: library
          persistentVolumeClaim:
            claimName: media-library
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: media
spec:
  selector:
    app: sonarr
  ports:
    - port: 8989
      targetPort: 8989
  type: ClusterIP
