apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      # linuxserver.io images run as uid/gid 911 ("abc"); the shared library
      # volume isn't auto-chowned like /config, so grant group write via fsGroup.
      securityContext:
        fsGroup: 911
      containers:
        - name: bazarr
          image: linuxserver/bazarr:v1.6.1-ls364
          ports:
            - containerPort: 6767
          volumeMounts:
            - name: config
              mountPath: /config
            # Same mount path as the rest of the stack: an import is a move or
            # a hardlink, never a copy across volumes.
            - name: library
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bazarr-config
        - name: library
          persistentVolumeClaim:
            claimName: media-library
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr
  namespace: media
spec:
  selector:
    app: bazarr
  ports:
    - port: 6767
      targetPort: 6767
  type: ClusterIP
