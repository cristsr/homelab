apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight
  namespace: hindsight
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hindsight
  template:
    metadata:
      labels:
        app: hindsight
    spec:
      containers:
        - name: hindsight
          # Slim variant: no local ML models. Embeddings and the LLM are remote
          # (OpenRouter), so the reranker is the model-free `rrf` passthrough and the
          # pod stays small.
          image: ghcr.io/vectorize-io/hindsight-api:1.0.0-slim
          ports:
            - containerPort: 8888
          env:
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: "openrouter"
            # Fact extraction and consolidation run on every session write-back, so
            # this is the cost driver (claude-haiku-4-5 burned 5 USD / 5.5M tokens in
            # half a day). gpt-oss-120b is ~25x cheaper ($0.037/$0.17 per M tokens);
            # the LLM can be swapped freely (only the embedding model is locked to the
            # DB dimension).
            - name: HINDSIGHT_API_LLM_MODEL
              value: "openai/gpt-oss-120b"
            # The embedding dimension (1536) is fixed in the database on first
            # start; changing this model later means re-embedding everything.
            - name: HINDSIGHT_API_EMBEDDINGS_PROVIDER
              value: "openai"
            - name: HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL
              value: "https://openrouter.ai/api/v1"
            - name: HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL
              value: "openai/text-embedding-3-small"
            - name: HINDSIGHT_API_RERANKER_PROVIDER
              value: "rrf"
            - name: HINDSIGHT_API_VECTOR_EXTENSION
              value: "pgvector"
            # The shared PostgreSQL LXC runs with the default max_connections=100 and
            # the upstream pool defaults to 100, which would starve the other databases.
            - name: HINDSIGHT_API_DB_POOL_MIN_SIZE
              value: "2"
            - name: HINDSIGHT_API_DB_POOL_MAX_SIZE
              value: "15"
            - name: HINDSIGHT_API_MIGRATION_ISOLATION
              value: "true"
            # Every request, MCP included, must carry HINDSIGHT_API_TENANT_API_KEY.
            - name: HINDSIGHT_API_TENANT_EXTENSION
              value: "hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension"
          # HINDSIGHT_API_DATABASE_URL, HINDSIGHT_API_LLM_API_KEY (also used for
          # the embeddings) and HINDSIGHT_API_TENANT_API_KEY.
          envFrom:
            - secretRef:
                name: hindsight-secrets
          startupProbe:
            httpGet:
              path: /health/live
              port: 8888
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8888
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8888
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hindsight
  namespace: hindsight
spec:
  selector:
    app: hindsight
  ports:
    - port: 8888
      targetPort: 8888
  type: ClusterIP
