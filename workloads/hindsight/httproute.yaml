apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight
  namespace: hindsight
spec:
  parentRefs:
    - name: main
      namespace: networking
      sectionName: https
  hostnames:
    - hindsight-api.internal.cristianpuenguenan.online
  rules:
    - backendRefs:
        - name: hindsight
          port: 8888
---
# The control plane gets its own hostname so it is not coupled to the API's paths.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight-control-plane
  namespace: hindsight
spec:
  parentRefs:
    - name: main
      namespace: networking
      sectionName: https
  hostnames:
    - hindsight.internal.cristianpuenguenan.online
  rules:
    - backendRefs:
        - name: hindsight-control-plane
          port: 9999
