apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flow-secrets
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: flow-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: database-url
      remoteRef:
        key: apps-flow/database-url
    - secretKey: mongodb-url
      remoteRef:
        key: apps-flow/mongodb-url
    - secretKey: redis-url
      remoteRef:
        key: apps-flow/redis-url