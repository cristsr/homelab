apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flow-api
  namespace: apps
spec:
  parentRefs:
    - name: public
      namespace: networking
  hostnames:
    - api.cristianpuenguenan.online
  rules:
    # Internal /flow APIs
    - matches:
        - path:
            type: PathPrefix
            value: /flow
      backendRefs:
        - name: flow
          port: 80
    # Public /webhooks
    - matches:
        - path:
            type: PathPrefix
            value: /webhooks
      backendRefs:
        - name: flow
          port: 80