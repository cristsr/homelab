apiVersion: apps/v1
kind: Deployment
metadata:
  name: songsterr-downloader
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: songsterr-downloader
  template:
    metadata:
      labels:
        app: songsterr-downloader
    spec:
      containers:
        - name: songsterr-downloader
          # Built from workloads/songsterr-downloader/Dockerfile; Renovate skips
          # ghcr.io/cristsr/**, so bump this tag by hand with the Dockerfile.
          image: ghcr.io/cristsr/songsterr-downloader:1.0.0
          ports:
            - containerPort: 3000
          env:
            # adapter-node rejects form POSTs whose Origin differs from this.
            - name: ORIGIN
              value: https://tabs.internal.cristianpuenguenan.online
          readinessProbe:
            httpGet:
              path: /
              port: 3000
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: songsterr-downloader
  namespace: apps
spec:
  selector:
    app: songsterr-downloader
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
