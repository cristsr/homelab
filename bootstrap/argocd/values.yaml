global:
  domain: argocd.cristianpuenguenan.online
  # Single-node cluster: without this, the control-plane's NoSchedule taint
  # leaves every pod Pending.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

# Memory limits below are sized from 7-day peaks (no CPU limits). Without them
# these pods are BestEffort and Talos' OOM controller kills them first.
server:
  ingress:
    enabled: false
  extraArgs:
    - --insecure
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 320Mi

dex:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

notifications:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

controller:
  # BestEffort otherwise, so Talos' OOM controller kills it first under memory
  # pressure (7-day peak: ~1.2Gi).
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 2Gi

repoServer:
  # Without limits, a memory-pressure kill gives exit 255 instead of a clean
  # OOMKilled, and the git index cached in the emptyDir can end up corrupted
  # across container restarts.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

configs:
  params:
    server.insecure: "true"
  cm:
    # No webhook is configured, so polling is the only sync mechanism. Never
    # set this to 0s - that silently disables sync entirely.
    timeout.reconciliation: 180s
    application.resourceTrackingMethod: annotation
    # Nothing here autoscales, and scripts/workload.sh scales workloads to 0 on
    # purpose: without this selfHeal would scale them straight back up.
    resource.customizations.ignoreDifferences.apps_Deployment: |
      jsonPointers:
        - /spec/replicas
    resource.customizations.ignoreDifferences.apps_StatefulSet: |
      jsonPointers:
        - /spec/replicas
  rbac:
    policy.default: role:readonly
    policy.csv: |
      p, admin, applications, *, */*, allow
      p, admin, applicationsets, *, */*, allow
      p, admin, projects, *, */*, allow
      p, admin, repositories, *, */*, allow
      p, admin, certificates, *, */*, allow
      p, admin, secrets, *, */*, allow
      p, admin, configmaps, *, */*, allow
      p, admin, workflows, *, */*, allow
      p, admin, events, *, */*, allow
      p, admin, logs, get, */*, allow
      g, admin, admin
      g, readonly, role:readonly
