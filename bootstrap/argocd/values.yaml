# Argo CD 9.x — ArgoCD v2.14.x (chart 9.5.13)
# helm upgrade --install argocd argo/argo-cd -n argocd -f bootstrap/argocd/values.yaml

global:
  domain: argocd.cristianpuenguenan.online

server:
  ingress:
    enabled: false
  extraArgs:
    - --insecure

configs:
  params:
    server.insecure: "true"
  cm:
    # Permite sync desde repositorio Git privado
    timeout.reconciliation: 180s
    # Temporal: mantener label-based tracking para evitar recursos huerfanos durante migracion
    # TODO: cambiar a 'annotation' despues de forzar sync de todas las apps
    application.resourceTrackingMethod: label
  rbac:
    policy.default: role:readonly
    # Admin: full access to all apps
    # Readonly: can view but not modify
    policy.csv: |
      p, admin, applications, *, */*, allow
      p, admin, applicationsets, *, */*, allow
      p, admin, projects, *, */*, allow
      p, admin, repositories, *, */*, allow
      p, admin, certificates, *, */*, allow
      p, admin, secrets, *, */*, allow
      p, admin, configmaps, *, */*, allow
      p, admin, workflows, *, */*, allow
      p, admin, events, *, */*, allow
      # v3.0+: logs RBAC enforced by default, add explicit logs permission
      p, admin, logs, get, */*, allow
      g, admin, admin
      g, readonly, role:readonly
