repositories:
  - name: cilium
    url: https://helm.cilium.io
  - name: argo
    url: https://argoproj.github.io/argo-helm

releases:
  - name: cilium
    namespace: kube-system
    chart: cilium/cilium
    version: 1.20.1
    values:
      - cilium/values.yaml
    wait: true
    timeout: 300
    hooks:
      - events: ["presync"]
        command: kubectl
        args: ["apply", "-f", "namespaces.yaml"]
      # El agent y el operator de Cilium reconcilian por su cuenta varios
      # recursos de gatewayAPI (Role/RoleBinding en cilium-secrets, el
      # GatewayClass) y les borran las anotaciones de ownership - ver el
      # comentario del script. Sin esto, el upgrade siguiente aborta con
      # "cannot be imported into the current release".
      - events: ["presync"]
        command: bash
        args: ["adopt-cilium-gateway-secrets.sh"]

  - name: argocd
    namespace: argocd
    chart: argo/argo-cd
    version: 9.5.13
    createNamespace: true
    values:
      - argocd/values.yaml
    wait: true
    timeout: 300
    needs:
      - kube-system/cilium
