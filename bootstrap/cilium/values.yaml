kubeProxyReplacement: "true"

k8sServiceHost: "127.0.0.1"
k8sServicePort: "6443"

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.244.0.0/16"
    clusterPoolIPv4MaskSize: 24

routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: "10.244.0.0/16"

gatewayAPI:
  enabled: true

# Asigna IPs LAN reales a los Services LoadBalancer de los Gateways (ver
# platform/networking/cilium-gateway/lb-ippool.yaml y
# l2-announcement-policy.yaml) - sin esto quedan en <pending> para siempre,
# sin ningun controlador externo (MetalLB) que los resuelva.
l2announcements:
  enabled: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - icmp
      - http

prometheus:
  enabled: true

operator:
  replicas: 1
  prometheus:
    enabled: true

daemon:
  runPath: /var/run/cilium
