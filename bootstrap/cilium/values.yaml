kubeProxyReplacement: "true"

k8sServiceHost: "127.0.0.1"
k8sServicePort: "6443"

# Talos already mounts cgroupv2/bpffs itself, so Cilium must not remount
# them. SYS_MODULE is dropped from the default capabilities because Talos
# doesn't allow workloads to load kernel modules.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.244.0.0/16"
    clusterPoolIPv4MaskSize: 24

routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: "10.244.0.0/16"

# Ingress is Envoy Gateway (ADR-023); Cilium no longer implements Gateway API.
gatewayAPI:
  enabled: false

# Assigns real LAN IPs to LoadBalancer Services; without it they stay
# <pending> forever, since there's no external controller like MetalLB.
l2announcements:
  enabled: true

hubble:
  enabled: true
  relay:
    enabled: true
    # hubble-relay/ui don't inherit tolerations from the chart by default,
    # so they'd stay Pending on this single-node cluster without this.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
  ui:
    enabled: true
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    frontend:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
    backend:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - icmp
      - http

prometheus:
  enabled: true

# Memory limits below are sized from 7-day peaks (no CPU limits). Without them
# these pods are BestEffort and Talos' OOM controller kills them first.
operator:
  replicas: 1
  prometheus:
    enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 256Mi

envoy:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

daemon:
  runPath: /var/run/cilium
