kubeProxyReplacement: "true"

k8sServiceHost: "127.0.0.1"
k8sServicePort: "6443"

# Talos already mounts cgroupv2/bpffs itself, so Cilium must not remount
# them. SYS_MODULE is dropped from the default capabilities because Talos
# doesn't allow workloads to load kernel modules.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.244.0.0/16"
    clusterPoolIPv4MaskSize: 24

routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: "10.244.0.0/16"

gatewayAPI:
  enabled: true

# Assigns real LAN IPs to LoadBalancer Services; without it they stay
# <pending> forever, since there's no external controller like MetalLB.
l2announcements:
  enabled: true

hubble:
  enabled: true
  relay:
    enabled: true
    # hubble-relay/ui don't inherit tolerations from the chart by default,
    # so they'd stay Pending on this single-node cluster without this.
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  ui:
    enabled: true
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - icmp
      - http

prometheus:
  enabled: true

operator:
  replicas: 1
  prometheus:
    enabled: true

daemon:
  runPath: /var/run/cilium
