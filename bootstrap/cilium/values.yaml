# Cilium 1.18.4 — k0s
# Aplicar manualmente: helm install cilium cilium/cilium -n kube-system -f bootstrap/cilium/values.yaml

kubeProxyReplacement: "true"

k8sServiceHost: "kube-apiserver.kube-system.svc.cluster.local"
k8sServicePort: "6443"

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.244.0.0/16"
    clusterPoolIPv4MaskSize: 24

routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: "10.244.0.0/16"

gatewayAPI:
  enabled: false

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

cni:
  binPath: /opt/cni/bin
  confPath: /etc/cni/net.d

bpf:
  masquerade: true

operator:
  replicas: 1

daemon:
  runPath: /var/run/cilium
