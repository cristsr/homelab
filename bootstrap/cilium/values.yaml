kubeProxyReplacement: "true"

k8sServiceHost: "127.0.0.1"
k8sServicePort: "6443"

# Talos monta cgroupv2/bpffs por su cuenta - no dejar que Cilium intente
# volver a montarlos. Y Talos no permite a los workloads cargar modulos de
# kernel, asi que SYS_MODULE se saca de las capabilities por defecto del
# chart (que si lo incluyen) - sin esto el init container clean-cilium-state
# falla con "unable to apply caps: operation not permitted" (confirmado en
# un deploy real). Valores segun la guia oficial de Talos:
# https://docs.siderolabs.com/kubernetes-guides/cni/deploying-cilium
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.244.0.0/16"
    clusterPoolIPv4MaskSize: 24

routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: "10.244.0.0/16"

gatewayAPI:
  enabled: true

# Asigna IPs LAN reales a los Services LoadBalancer de los Gateways (ver
# platform/networking/cilium-gateway/lb-ippool.yaml y
# l2-announcement-policy.yaml) - sin esto quedan en <pending> para siempre,
# sin ningun controlador externo (MetalLB) que los resuelva.
l2announcements:
  enabled: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - icmp
      - http

prometheus:
  enabled: true

operator:
  replicas: 1
  prometheus:
    enabled: true

daemon:
  runPath: /var/run/cilium
