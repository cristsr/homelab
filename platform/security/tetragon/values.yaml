# Tetragon Helm values
# https://github.com/cilium/tetragon/blob/main/install/kubernetes/values.yaml

tetragon:
  enabled: true
  grpc:
    enabled: true
    address: "unix:///var/run/tetragon/tetragon.sock"
  exportFilename: "tetragon.log"
  exportFilePerm: "600"
  exportFileMaxSizeMB: 10
  exportFileMaxBackups: 5
  enableK8sAPI: true
  enablePolicyFilter: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: false

tetragonOperator:
  enabled: true
  tracingPolicy:
    enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: false

# Installs CRDs via Helm so they exist before ArgoCD creates TracingPolicy resources.
crds:
  installMethod: "helm"

export:
  mode: "stdout"
