# The tetragon DaemonSet needs hostNetwork/hostPath and a privileged
# container to read eBPF events, which requires privileged PodSecurity.
apiVersion: v1
kind: Namespace
metadata:
  name: tetragon
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
