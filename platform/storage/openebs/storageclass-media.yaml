# poolname must match the zpool created by Terraform - hardcoded on both sides on purpose.
# Not marked as the cluster default: openebs-zfs stays the default, and claims that want
# the media disk name this class explicitly.
# `shared` is required here: the driver defaults it to "no", which makes a volume
# mountable by exactly one pod, and the media library is read and written by several
# apps at once. StorageClass parameters are immutable, so changing it means deleting and
# recreating the class, and only claims provisioned after that pick it up.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-zfs-media
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
provisioner: zfs.csi.openebs.io
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  poolname: "media-pool"
  fstype: "zfs"
  compression: "zstd"
  shared: "yes"
