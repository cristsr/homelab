# Values for the zfs-localpv chart. Talos mounts the kubelet at the chart's
# default path, so zfsNode.kubeletDir doesn't need overriding.

analytics:
  enabled: false

# Talos has an immutable rootfs and no /home, so the chart's default key
# directory fails to create. /var is the only writable persistent path.
zfsNode:
  encrKeysDir: "/var/openebs/keys"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

zfsController:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi
