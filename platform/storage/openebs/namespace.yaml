# The ZFS CSI node plugin DaemonSet needs privileged access to manage
# volumes; without it, PVCs stay Pending forever.
apiVersion: v1
kind: Namespace
metadata:
  name: openebs
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
