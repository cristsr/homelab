config:
  # OpenBao configuration
  vault:
    address: "http://openbao.secret-management.svc.cluster.local:8200"
    # Token will be set via Kubernetes auth
    authMethod: "kubernetes"
    role: "vault-sync-operator"
    # Mount path for KV engine
    mountPath: "secret"

# Operator configuration
operator:
  # Run in namespace where secrets are created
  watchNamespace: ""
  reconcileInterval: "5m"

# Create a role in Vault for the operator
rbac:
  create: true

# Service account configuration
serviceAccount:
  create: true
  name: "vault-sync-operator-sa"