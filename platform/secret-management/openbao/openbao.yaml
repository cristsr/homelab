server:
  dev:
    enabled: false

  ha:
    enabled: false
    replicas: 1

  standalone:
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "file" {
        path = "/openbao/data"
      }

      seal "static" {
        current_key_id = "homelab-v1"
        current_key    = "env://BAO_UNSEAL_KEY"
      }

  extraSecretEnvironmentVars:
    - envName: BAO_UNSEAL_KEY
      secretName: openbao-static-unseal-key
      secretKey: key

  dataStorage:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
  auditStorage:
    enabled: false

  extraArgs: "-log-level=info"

  service:
    enabled: true
    type: ClusterIP
    port: 8200
    targetPort: 8200

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  ui:
    enabled: true

injector:
  enabled: false
