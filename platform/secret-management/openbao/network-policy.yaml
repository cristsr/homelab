apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-default-deny
  namespace: secret-management
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  ingress:
    # Cluster de un solo nodo con gatewayAPI.enabled=true y sin Envoy
    # separado: el proxy va embebido en el cilium-agent (hostNetwork), asi
    # que el trafico de la HTTPRoute de la UI llega como host-originado, no
    # pod-a-pod. Lo mismo aplica a `kubectl port-forward svc/openbao`
    # (scripts/load-secrets-to-openbao.sh) - lo proxea el kubelet del nodo.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # External Secrets Operator (poll de KV) y el Job openbao-init, ambos
    # en este mismo namespace.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: secret-management
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
  egress: []
