# ClusterSecretStore - points to OpenBao
# After OpenBao is initialized and Kubernetes auth is enabled,
# update the server URL and auth path accordingly

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "http://192.168.80.35:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets-sa"
            namespace: "secret-management"
