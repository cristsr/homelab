# ClusterSecretStore - points to 1Password (vault "Homelab"), via a
# Service Account token. Replaces OpenBao: no seal/unseal, no LXC, no
# Kubernetes auth backend to configure - just a read-only token scoped to
# this one vault.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: Homelab
      auth:
        serviceAccountSecretRef:
          name: onepassword-service-account-token
          key: token
          namespace: secret-management
