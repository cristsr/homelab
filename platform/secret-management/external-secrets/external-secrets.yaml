installCRDs: true

replicaCount: 1

# 128Mi wasn't enough: after a long window without syncing, the controller
# reconciles the whole backlog at once and enters an OOMKilled loop.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

webhook:
  replicaCount: 1

certController:
  replicaCount: 1

networkPolicy:
  enabled: true

metrics:
  serviceMonitor:
    enabled: true
    namespace: observability
