installCRDs: true

replicaCount: 1

# 128Mi wasn't enough: after a long window without syncing, the controller
# reconciles the whole backlog at once and enters an OOMKilled loop.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

webhook:
  replicaCount: 1

certController:
  replicaCount: 1

# Chart 2.11 renders this policy as Egress+Ingress with no egress rules, which
# drops all of the controller's outbound traffic (API server, DNS). Only what
# it needs today is allowed; add an HTTPS rule when a provider store is added.
networkPolicy:
  enabled: true
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # No `to`: Cilium (kubeProxyReplacement) evaluates the API server after
    # service translation, when the destination is the node IP, which an
    # ipBlock rule cannot select.
    - ports:
        - protocol: TCP
          port: 6443

metrics:
  serviceMonitor:
    enabled: true
    namespace: observability
