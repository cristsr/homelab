installCRDs: true

replicaCount: 1

# 128Mi era insuficiente: tras una ventana larga sin sincronizar (ver
# ADR-017/incidente del repo-server), el controller reconcilia todo el
# backlog de golpe y entra en OOMKilled loop - nunca llega a marcar el
# ClusterSecretStore como listo.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

webhook:
  replicaCount: 1

certController:
  replicaCount: 1

networkPolicy:
  enabled: true

metrics:
  serviceMonitor:
    enabled: true
    namespace: observability
