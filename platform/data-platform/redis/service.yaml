apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: data-platform
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# Headless service requerido por el StatefulSet para DNS estable por pod
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: data-platform
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
