apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flow
  template:
    metadata:
      labels:
        app: flow
    spec:
      containers:
        - name: flow
          image: traefik/whoami:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flow
  namespace: apps
spec:
  selector:
    app: flow
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
