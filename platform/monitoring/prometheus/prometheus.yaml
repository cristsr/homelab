apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: prometheus
  namespace: monitoring
spec:
  retention: 15d
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: longhorn
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
  serviceMonitorSelector:
    matchLabels:
      prometheus: monitor
  serviceMonitorNamespaceSelector: {}
  ruleSelector:
    matchLabels:
      prometheus: monitor
  alerting:
    alertmanagers:
      - namespace: monitoring
        name: alertmanager
        port: web