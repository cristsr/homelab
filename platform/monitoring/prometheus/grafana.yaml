apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: monitoring
  labels:
    dashboards: "grafana"
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  disableDefaultAdminSecret: true
  deployment:
    spec:
      replicas: 1
      template:
        spec:
          containers:
            - name: grafana
              resources:
                requests:
                  cpu: 100m
                  memory: 100Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              envFrom:
                - secretRef:
                    name: grafana-admin-secret
  service:
    spec:
      type: ClusterIP
  config:
    log:
      mode: "console"
    security:
      allow_embedding: "true"
      allow_force_reset_user_password: "false"
    auth:
      disable_login_form: "false"
      disable_signout_menu: "false"
    server:
      root_url: "https://grafana.cristianpuenguenan.online"
  persistentVolumeClaim:
    spec:
      storageClassName: longhorn
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
