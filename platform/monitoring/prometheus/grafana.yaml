apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: monitoring
  labels:
    dashboards: "grafana"
spec:
  deployment:
    spec:
      replicas: 1
      template:
        spec:
          containers:
            - name: grafana
              resources:
                requests:
                  cpu: 100m
                  memory: 100Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              envFrom:
                - secretRef:
                    name: grafana-admin-secret
  service:
    type: ClusterIP
    ports:
      - name: http
        port: 3000
  config:
    log:
      mode: "console"
    security:
      allow_embedding: true
    auth:
      disable_login_form: false
      disable_signout_menu: false
    server:
      root_url: "https://grafana.cristianpuenguenan.online"
  dashboardLabelSelectors:
    - matchExpressions:
        - key: dashboards
          operator: In
          values:
            - grafana
  persistentVolumeClaim:
    spec:
      storageClassName: longhorn
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
