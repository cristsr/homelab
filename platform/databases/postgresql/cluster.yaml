apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: databases
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-standard-bookworm

  storage:
    size: 10Gi
    storageClass: longhorn-retain

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  bootstrap:
    initdb:
      database: homelab
      owner: admin
      secret:
        name: postgresql-app-secret
      postInitSQL:
        - "CREATE DATABASE sonarqube;"
        - "CREATE ROLE sonarqube WITH LOGIN;"
        - "GRANT ALL PRIVILEGES ON DATABASE sonarqube TO sonarqube;"
        - "ALTER DATABASE sonarqube OWNER TO sonarqube;"

  managed:
    roles:
      - name: postgresql-app
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: postgresql-app-secret
          key: password

  monitoring:
    enablePodMonitor: true
