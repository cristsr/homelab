apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgresql-default-deny
  namespace: databases
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  ingress:
    # Solo pods en namespaces autorizados pueden conectarse
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: apps
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dev-tools
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
  egress: []
