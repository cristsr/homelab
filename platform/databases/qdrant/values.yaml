# Qdrant — vector database para OpenMemory
replicaCount: 1

persistence:
  accessModes: ["ReadWriteOnce"]
  size: 10Gi
  storageClassName: longhorn

service:
  type: ClusterIP

config:
  cluster:
    enabled: false

# Configuración de API key desde ExternalSecret
extraEnv:
  - name: QDRANT__SERVICE__API_KEY
    valueFrom:
      secretKeyRef:
        name: qdrant-api-key
        key: api_key

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi