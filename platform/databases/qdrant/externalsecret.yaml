apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: qdrant-api-key
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: qdrant-api-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api_key
      remoteRef:
        key: secret/data/databases/qdrant
        property: api_key