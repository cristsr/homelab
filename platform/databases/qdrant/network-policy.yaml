apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qdrant-default-deny
  namespace: databases
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dev-tools
      toPorts:
        - ports:
            - port: "6333"
              protocol: TCP
            - port: "6334"
              protocol: TCP
  egress: []
