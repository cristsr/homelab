apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mongodb-default-deny
  namespace: databases
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: apps
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dev-tools
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP
  egress: []
