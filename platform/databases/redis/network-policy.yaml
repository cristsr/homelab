apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-default-deny
  namespace: databases
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: apps
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: devtools
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
  egress: []
