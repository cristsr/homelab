# Redis 7.x (Bitnami) — solo ClusterIP
architecture: standalone

auth:
  enabled: true
  password: "REEMPLAZAR_CON_PASSWORD"

master:
  persistence:
    enabled: true
    storageClass: longhorn
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

service:
  type: ClusterIP

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: kube-prometheus-stack
