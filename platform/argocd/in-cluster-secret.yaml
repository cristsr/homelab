# ArgoCD in-cluster secret - must be applied manually after ArgoCD is installed
# This tells ArgoCD how to connect to the local cluster

apiVersion: v1
kind: Secret
metadata:
  name: in-cluster-secret
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  server: https://kubernetes.default.svc
  name: in-cluster
  config: |
    {
      "tlsClientConfig": {
        "insecure": false,
        "caData": ""
      }
    }
---
# Alternative: generate CA_DATA from the kube-root-ca configmap
# CA_DATA=$(kubectl get configmap kube-root-ca.crt -n kube-system -o jsonpath='{.data.ca\.crt}' | base64 -w0)