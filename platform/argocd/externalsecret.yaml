apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-credentials
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: homelab-repo
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: argocd/username
    - secretKey: password
      remoteRef:
        key: argocd/github_pat
    - secretKey: url
      remoteRef:
        key: argocd/url