community:
  enabled: true

monitoringPasscode: "homelab"

deploymentAnnotations:
  reloader.stakater.com/auto: "true"

persistence:
  enabled: true
  storageClass: longhorn
  size: 10Gi

postgresql:
  enabled: false

jdbcOverwrite:
  enable: true
  jdbcUrl: "jdbc:postgresql://postgresql-rw.infra.svc.cluster.local:5432/sonarqube"
  jdbcUsername: sonarqube
  jdbcSecretName: sonarqube-db-secret
  jdbcSecretPasswordKey: password

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: false

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi
