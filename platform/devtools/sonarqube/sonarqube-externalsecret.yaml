apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarqube-db-secret
  namespace: devtools
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: sonarqube-db-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: devtools/sonarqube
        property: password
