apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openmemory-default-deny
  namespace: devtools
spec:
  endpointSelector:
    matchLabels:
      app: openmemory
  ingress:
    # Traffic arrives via Agent Gateway, a real pod in the networking
    # namespace, not the embedded Cilium proxy.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
      toPorts:
        - ports:
            - port: "8765"
              protocol: TCP
  egress: []
