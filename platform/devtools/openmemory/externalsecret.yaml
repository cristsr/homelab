apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openmemory-secrets
  namespace: devtools
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openmemory-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: devtools/openmemory
        property: OPENAI_API_KEY
    - secretKey: QDRANT_API_KEY
      remoteRef:
        key: databases/qdrant
        property: api_key