apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmemory
  namespace: devtools
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openmemory
  template:
    metadata:
      labels:
        app: openmemory
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: openmemory
          image: ghcr.io/cristsr/openmemory-mcp:latest
          ports:
            - containerPort: 8765
          env:
            - name: USER
              value: "cristian"
            - name: OPENAI_BASE_URL
              value: "https://openrouter.ai/api/v1"
            - name: LLM_PROVIDER
              value: "openai"
            - name: LLM_MODEL
              value: "anthropic/claude-haiku-4-5"
            - name: LLM_BASE_URL
              value: "https://openrouter.ai/api/v1"
            - name: EMBEDDER_PROVIDER
              value: "openai"
            - name: EMBEDDER_MODEL
              value: "openai/text-embedding-3-small"
            - name: EMBEDDER_BASE_URL
              value: "https://openrouter.ai/api/v1"
            - name: QDRANT_HOST
              value: "qdrant.infra.svc.cluster.local"
            - name: QDRANT_PORT
              value: "6333"
            - name: DATABASE_URL
              value: "sqlite:////data/openmemory.db"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openmemory-secrets
                  key: OPENAI_API_KEY
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openmemory-secrets
                  key: QDRANT_API_KEY
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openmemory-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openmemory-data
  namespace: devtools
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: openebs-lvm-retain
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openmemory
  namespace: devtools
spec:
  selector:
    app: openmemory
  ports:
    - port: 8765
      targetPort: 8765
  type: ClusterIP
