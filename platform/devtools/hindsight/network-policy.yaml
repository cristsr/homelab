apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hindsight-default-deny
  namespace: hindsight
spec:
  endpointSelector:
    matchLabels:
      app: hindsight
  ingress:
    # Traffic arrives via Envoy Gateway's proxy pods, which run in the
    # controller's namespace, not in `networking`.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
  egress: []
