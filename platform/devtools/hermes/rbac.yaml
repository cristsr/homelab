apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
  namespace: devtools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-job-runner
  namespace: sandboxes
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-job-runner
  namespace: sandboxes
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: devtools
roleRef:
  kind: Role
  name: hermes-job-runner
  apiGroup: rbac.authorization.k8s.io
