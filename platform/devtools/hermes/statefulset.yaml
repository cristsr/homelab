apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: devtools
spec:
  clusterIP: None
  selector:
    app: hermes
  ports:
    - port: 8642
      targetPort: 8642
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: devtools
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: hermes
  replicas: 1
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      serviceAccountName: hermes
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:latest@sha256:d4da4a40cd7a28aba983775d9fd31d94cbf153eeb0cb9e844d6d0f612b7c24db
          # The image defaults to the interactive chat, which exits at once
          # without a TTY; the Gateway API is the foreground server mode.
          args: ["gateway", "run"]
          ports:
            - containerPort: 8642
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8642
            periodSeconds: 10
            failureThreshold: 6
          env:
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: FORGEJO_TOKEN
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: API_SERVER_KEY
          volumeMounts:
            - name: data
              mountPath: /opt/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: openebs-zfs-retain
        resources:
          requests:
            storage: 2Gi
