apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: devtools
spec:
  clusterIP: None
  selector:
    app: hermes
  ports:
    - port: 8642
      targetPort: 8642
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: devtools
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: hermes
  replicas: 1
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      serviceAccountName: hermes
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:latest
          ports:
            - containerPort: 8642
          env:
            - name: FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: FORGEJO_TOKEN
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: API_SERVER_KEY
          volumeMounts:
            - name: data
              mountPath: /opt/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: openebs-zfs-retain
        resources:
          requests:
            storage: 2Gi
