apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmemory-ui
  namespace: devtools
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openmemory-ui
  template:
    metadata:
      labels:
        app: openmemory-ui
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: openmemory-ui
          image: ghcr.io/cristsr/openmemory-ui:latest@sha256:d16b7f2267c4ac13d65ece1fb9905f3424fb1b6b5ffeaf952c6e4afaba1d19a1
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://openmemory-api.cristianpuenguenan.online"
            - name: NEXT_PUBLIC_USER_ID
              value: "cristian"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openmemory-ui
  namespace: devtools
spec:
  selector:
    app: openmemory-ui
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
