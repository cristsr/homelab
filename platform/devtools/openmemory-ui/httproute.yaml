apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openmemory-ui
  namespace: devtools
spec:
  parentRefs:
    - name: main
      namespace: networking
      sectionName: https
    - name: main
      namespace: networking
      sectionName: https-online
  hostnames:
    - openmemory.cristianpuenguenan.internal
    - openmemory.internal.cristianpuenguenan.online
  rules:
    - backendRefs:
        - name: openmemory-ui
          port: 3000
