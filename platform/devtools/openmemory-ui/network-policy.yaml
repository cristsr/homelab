apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openmemory-ui-default-deny
  namespace: devtools
spec:
  endpointSelector:
    matchLabels:
      app: openmemory-ui
  ingress:
    # Traffic arrives from the Envoy Gateway proxy pods, which run in the
    # controller's namespace, not in `networking`.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress: []
