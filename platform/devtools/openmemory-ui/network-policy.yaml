apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openmemory-ui-default-deny
  namespace: devtools
spec:
  endpointSelector:
    matchLabels:
      app: openmemory-ui
  ingress:
    # Traffic arrives via the Cilium Gateway's embedded proxy, which runs on
    # the host network - it looks like host-originated traffic, not pod traffic.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress: []
