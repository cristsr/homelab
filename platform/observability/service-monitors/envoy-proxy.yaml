# Per-route request counter from Envoy Gateway's data plane
# (envoy_cluster_upstream_rq_total{envoy_cluster_name="httproute/<ns>/<name>/rule/0"}).
# KubeElasti reads it to decide when an idle workload can scale to zero.
# Only that one series family is kept: Envoy exposes thousands.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
  namespace: observability
  labels:
    app: envoy-proxy
spec:
  namespaceSelector:
    matchNames:
      - envoy-gateway-system
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 30s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: envoy_cluster_upstream_rq_total
          action: keep
