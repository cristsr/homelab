# Scrapes node_exporter on the Proxmox host (ansible/hypervisor-power.yaml) and
# derives the hypervisor's power draw and its monthly kWh projection from RAPL.
# RAPL only sees CPU package + DRAM, so HYPERVISOR_BASE_WATTS below is a
# calibration knob for everything else (disks, fans, PSU losses): set it to
# (wall meter reading - homelab:hypervisor_power_watts) once you have a reading.
# A ScrapeConfig, not a Service + Endpoints: ArgoCD excludes Endpoints by
# default, so a hand-written one is never applied and the target never exists.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: hypervisor-node-exporter
  namespace: observability
  labels:
    release: prometheus
spec:
  scrapeInterval: 30s
  staticConfigs:
    - targets:
        - 192.168.80.20:9100
  relabelings:
    - action: replace
      targetLabel: instance
      replacement: proxmox-host
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hypervisor-power
  namespace: observability
  labels:
    release: prometheus
spec:
  groups:
    - name: hypervisor-power
      rules:
        # HYPERVISOR_BASE_WATTS = 25 (calibration knob, see header).
        - record: homelab:hypervisor_power_watts
          expr: |
            sum(rate({__name__=~"node_rapl_(package|dram)_joules_total", instance="proxmox-host"}[5m])) + 25
        # 730 h = average month. Average over 7d so a busy hour doesn't skew it.
        - record: homelab:hypervisor_energy_kwh_month_forecast
          expr: avg_over_time(homelab:hypervisor_power_watts[7d]) * 730 / 1000
