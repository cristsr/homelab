prometheus:
  enabled: true
  prometheusSpec:
    retention: 15d
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: openebs-zfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: openebs-zfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin-secret
    userKey: GF_SECURITY_ADMIN_USER
    passwordKey: GF_SECURITY_ADMIN_PASSWORD
  # Grafana doesn't hot-reload the admin secret on its own; Reloader restarts
  # the pod when it changes.
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  # The ZFS volume is RWO: a rolling update's new pod can't mount it while the
  # old one holds it.
  deploymentStrategy:
    type: Recreate
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      # One folder per ConfigMap via the grafana_folder annotation. The chart's
      # bundled dashboards all share the annotation below; it can't be set per
      # dashboard.
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
      annotations:
        grafana_folder: Cluster
    datasources:
      enabled: true
      searchNamespace: ALL
  persistence:
    enabled: true
    storageClassName: openebs-zfs
    size: 5Gi
    accessModes: ["ReadWriteOnce"]

defaultRules:
  create: true

kubeApiServer:
  enabled: true

kubelet:
  enabled: true

# Talos binds these to localhost, so the targets are always down.
kubeControllerManager:
  enabled: false

coreDns:
  enabled: true

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeDns:
  enabled: false

kubernetesServiceMonitors:
  enabled: true

# AIX and macOS dashboards are noise on a Linux-only homelab.
nodeExporter:
  operatingSystems:
    aix:
      enabled: false
    darwin:
      enabled: false

prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true

prometheus-windows-exporter:
  enabled: false
