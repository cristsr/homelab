prometheus:
  enabled: true
  prometheusSpec:
    retention: 15d
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    # Without requests/limits the pod is BestEffort and Talos' OOM controller
    # picks it first under memory pressure (7-day peak: ~690Mi).
    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: openebs-zfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: openebs-zfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

grafana:
  enabled: true
  # The chart ships all or none of its dashboards. We keep the few we use as
  # our own ConfigMaps in platform/observability/grafana-dashboards.
  defaultDashboardsEnabled: false
  # BestEffort otherwise: it was OOM-killed 40+ times (7-day peaks: Grafana
  # ~815Mi, each sidecar ~95Mi).
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1Gi
  admin:
    existingSecret: grafana-admin-secret
    userKey: GF_SECURITY_ADMIN_USER
    passwordKey: GF_SECURITY_ADMIN_PASSWORD
  # Grafana doesn't hot-reload the admin secret on its own; Reloader restarts
  # the pod when it changes.
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  # The ZFS volume is RWO: a rolling update's new pod can't mount it while the
  # old one holds it.
  deploymentStrategy:
    type: Recreate
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 256Mi
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      # One folder per ConfigMap via its grafana_folder annotation.
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      searchNamespace: ALL
  persistence:
    enabled: true
    storageClassName: openebs-zfs
    size: 5Gi
    accessModes: ["ReadWriteOnce"]

defaultRules:
  create: true

kubeApiServer:
  enabled: true

kubelet:
  enabled: true

# Talos binds these to localhost, so the targets are always down.
kubeControllerManager:
  enabled: false

coreDns:
  enabled: true

kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

kubeDns:
  enabled: false

kubernetesServiceMonitors:
  enabled: true

prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 192Mi

prometheusOperator:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 192Mi

prometheus-windows-exporter:
  enabled: false
