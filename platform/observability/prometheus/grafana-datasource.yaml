apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: observability
  labels:
    app: grafana
spec:
  name: prometheus
  type: prometheus
  access: proxy
  url: http://prometheus-kube-prometheus-operator.observability:9090
  isDefault: true
  editable: false