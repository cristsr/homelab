# node-exporter's DaemonSet needs hostNetwork/hostPID/hostPath/hostPort to
# read metrics from the host, which requires privileged PodSecurity.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
