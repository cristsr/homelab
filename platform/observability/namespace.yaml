# El admission del cluster aplica PodSecurity baseline por defecto en
# namespaces sin labels (ver platform/storage/openebs/namespace.yaml para
# el mismo patron). El DaemonSet prometheus-prometheus-node-exporter
# necesita hostNetwork, hostPID, hostPath (proc/sys/root) y hostPort para
# leer metricas del host - baseline lo bloquea, dejando el DaemonSet en
# FailedCreate eterno.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
