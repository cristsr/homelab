apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: main
      namespace: networking
      sectionName: https
    - name: main
      namespace: networking
      sectionName: https-online
  hostnames:
    - grafana.cristianpuenguenan.internal
    - grafana.internal.cristianpuenguenan.online
  rules:
    - backendRefs:
        - name: prometheus-grafana
          port: 80