apiVersion: v1
kind: Service
metadata:
  name: apisix-etcd
  namespace: ingress
  labels:
    app: apisix-etcd
spec:
  selector:
    app: apisix-etcd
  ports:
    - name: client
      port: 2379
    - name: peer
      port: 2380
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apisix-etcd
  namespace: ingress
  labels:
    app: apisix-etcd
spec:
  serviceName: apisix-etcd
  replicas: 1
  selector:
    matchLabels:
      app: apisix-etcd
  template:
    metadata:
      labels:
        app: apisix-etcd
    spec:
      containers:
        - name: etcd
          image: registry.k8s.io/etcd:3.5.16-0
          command:
            - etcd
            - --name=default
            - --data-dir=/var/etcd/data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://apisix-etcd.infra.svc.cluster.local:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://apisix-etcd.infra.svc.cluster.local:2380
            - --initial-cluster=default=http://apisix-etcd.infra.svc.cluster.local:2380
            - --initial-cluster-token=apisix-etcd
            - --initial-cluster-state=new
          ports:
            - name: client
              containerPort: 2379
            - name: peer
              containerPort: 2380
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/etcd/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 2Gi
