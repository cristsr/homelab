apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis-default-deny
  namespace: infra
spec:
  endpointSelector:
    matchLabels:
      app: redis
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: apps
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: devtools
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
  egress: []
