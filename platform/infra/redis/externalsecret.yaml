apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-secret
  namespace: infra
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: redis-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: redis-password
      remoteRef:
        key: databases/redis
        property: redis-password