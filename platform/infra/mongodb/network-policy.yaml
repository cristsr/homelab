apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mongodb-default-deny
  namespace: infra
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: percona-server-mongodb
      app.kubernetes.io/instance: mongodb
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: apps
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: devtools
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: infra
            app.kubernetes.io/name: psmdb-operator
      toPorts:
        - ports:
            - port: "27017"
              protocol: TCP
  egress:
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
