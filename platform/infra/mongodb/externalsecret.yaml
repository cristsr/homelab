apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-app-secret
  namespace: infra
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: mongodb-app-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: databases/mongodb-app
        property: password