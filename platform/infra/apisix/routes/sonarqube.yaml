apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: sonarqube
  namespace: infra
spec:
  http:
    - name: sonarqube
      match:
        hosts:
          - sonarqube.cristianpuenguenan.online
        paths:
          - "/*"
      backends:
        - serviceName: sonarqube-sonarqube
          servicePort: 9000
          resolveGranularity: endpoint
      plugin_config_name: internal-dashboard
