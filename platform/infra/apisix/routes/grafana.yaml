apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: grafana
  namespace: infra
spec:
  http:
    - name: grafana
      match:
        hosts:
          - grafana.cristianpuenguenan.online
        paths:
          - "/*"
      backends:
        - serviceName: grafana-proxy
          servicePort: 80
      plugin_config_name: internal-dashboard
