apiVersion: apisix.apache.org/v2
kind: ApisixGlobalRule
metadata:
  name: global-plugins
  namespace: infra
spec:
  plugins:
    # Detecta IP real del cliente detrás de Cloudflare Tunnel
    - name: real-ip
      enable: true
      config:
        source: "X-Forwarded-For"
        trusted_addresses:
          - "127.0.0.1"

    # Métricas para Prometheus en todas las rutas
    - name: prometheus
      enable: true
      config:
        prefer_name: true
