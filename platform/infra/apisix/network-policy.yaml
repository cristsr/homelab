apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: apisix-admin-api-isolation
  namespace: ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: apisix
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: apisix-ingress-controller
      toPorts:
        - ports:
            - port: "9180"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: apisix-dashboard
      toPorts:
        - ports:
            - port: "9180"
              protocol: TCP
    - toPorts:
        - ports:
            - port: "9080"
              protocol: TCP
            - port: "9443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ingress
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: infra
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: databases
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dev-tools
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: apps
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitoring
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
