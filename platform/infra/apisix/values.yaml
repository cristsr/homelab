# APISIX 2.9.x — ingress único con hostPort directo en 192.168.80.20

apisix:
  enabled: true
  replicaCount: 1

  # hostPort directo — sin MetalLB, sin NodePort redireccionado
  service:
    type: ClusterIP

  # Bind 80/443 directo a la IP del nodo
  hostNetwork: false
  hostPort:
    enabled: true
    http: 80
    https: 443

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9091"

  securityContext:
    capabilities:
      add:
        - NET_BIND_SERVICE

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  # Admin API solo ClusterIP — NetworkPolicy restrictiva en platform/infra/apisix/network-policy.yaml
  admin:
    enabled: true
    type: ClusterIP
    port: 9180

# Ingress Controller — reconcilia CRDs → etcd de APISIX
ingress-controller:
  enabled: true
  config:
    apisix:
      serviceName: apisix-admin
      serviceNamespace: infra
      adminKey: "REEMPLAZAR_CON_ADMIN_KEY"

# etcd dedicado para APISIX con PVC en Longhorn
etcd:
  enabled: true
  replicaCount: 1
  persistence:
    enabled: true
    storageClass: longhorn
    size: 2Gi

# Dashboard APISIX — acceso solo via ApisixRoute con ip-restriction
dashboard:
  enabled: true
  service:
    type: ClusterIP

# Sin ingress nativo — gestionado por ApisixRoute
gateway:
  type: ClusterIP
  tls:
    enabled: false
