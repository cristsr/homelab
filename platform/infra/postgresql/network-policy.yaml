apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: postgresql-default-deny
  namespace: infra
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: postgresql
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: apps
      authentication:
        mode: required
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

  egress: []
