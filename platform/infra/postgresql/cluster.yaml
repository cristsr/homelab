apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  namespace: infra
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-standard-bookworm

  storage:
    size: 10Gi
    storageClass: longhorn-retain

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  bootstrap:
    initdb:
      database: homelab
      owner: admin
      secret:
        name: postgresql-app-secret
      postInitSQL: []

  managed:
    roles:
      - name: postgresql-app
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: postgresql-app-secret

  monitoring:
    enablePodMonitor: true
