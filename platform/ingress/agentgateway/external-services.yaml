# External Services para Agentgateway
# Agentgateway puede alcanzar servicios en cualquier namespace directamente,
# pero mantenemos estos para backward compatibility

# ── argocd-server (namespace: argocd) ──────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: ingress
spec:
  type: ExternalName
  externalName: argocd-server.argocd.svc.cluster.local
  ports:
    - port: 80
---
# ── headlamp (namespace: monitoring) ────────────────────────────────────────────
apiVersion: v1
