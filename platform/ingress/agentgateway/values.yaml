# Agentgateway ingress configuration
# Namespace dimana se despliega el gateway
namespace: ingress

# Configuración del gateway
gateway:
  className: agentgateway
  # IP o hostname para el gateway (usará LoadBalancer por defecto)
  controller:
    replicas: 1
    service:
      type: LoadBalancer

# Habilitar métricas
metrics:
  enabled: true
  serviceMonitor:
    enabled: false

# Recursos
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi