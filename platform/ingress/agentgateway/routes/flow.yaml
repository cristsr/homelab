apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flow-api
  namespace: apps
spec:
  parentRefs:
    - name: agentgateway
      namespace: ingress
  rules:
    # API interna con autenticación (jwt-auth simulado con external auth)
    - matches:
        - path:
            type: PathPrefix
            value: /flow
          headers:
            method: GET
      backendRefs:
        - name: flow
          port: 80
          weight: 100
    # Webhooks públicos
    - matches:
        - path:
            type: PathPrefix
            value: /webhooks
      backendRefs:
        - name: flow
          port: 80
          weight: 100