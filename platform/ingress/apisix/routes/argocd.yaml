apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: argocd
  namespace: ingress
spec:
  http:
    - name: argocd
      match:
        hosts:
          - argocd.cristianpuenguenan.online
        paths:
          - "/*"
      backends:
        - serviceName: argocd-server
          servicePort: 80
      plugin_config_name: internal-dashboard
