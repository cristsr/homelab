# Servicios espejo en namespace 'ingress' para que APISIX Ingress Controller
# pueda resolver backends que viven en otros namespaces.
#
# - argocd-server y headlamp usan ExternalName (DNS estable, sin IPs hardcodeadas)
# - Los demás usan ClusterIP + Endpoints con la ClusterIP del servicio real,
#   necesario para resolveGranularity: endpoint (requerimiento de APISIX IC)

# ── argocd-server (namespace: argocd) ──────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
  namespace: ingress
spec:
  type: ExternalName
  externalName: argocd-server.argocd.svc.cluster.local
  ports:
    - port: 80
---
# ── headlamp (namespace: infra) ────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: ingress
spec:
  type: ExternalName
  externalName: headlamp.infra.svc.cluster.local
  ports:
    - port: 80
---
# ── kube-prometheus-stack-grafana (namespace: monitoring) ──────────────────
apiVersion: v1
kind: Service
metadata:
  name: kube-prometheus-stack-grafana
  namespace: ingress
spec:
  ports:
    - port: 80
      protocol: TCP
      targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kube-prometheus-stack-grafana
  namespace: ingress
subsets:
  - addresses:
      - ip: 10.152.183.187
    ports:
      - port: 80
---
