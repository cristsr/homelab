# ClusterSecretStore using token auth (simpler for homelab)
# For production, use Kubernetes auth with proper RBAC

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "http://openbao.vault.svc.cluster.local:8200"
      path: "secret"  # KV v2 mount path
      version: "v2"   # KV v2 secrets engine
      auth:
        # Use token auth with root token (dev mode)
        tokenSecretRef:
          name: openbao-root-token
          namespace: vault
          key: token
