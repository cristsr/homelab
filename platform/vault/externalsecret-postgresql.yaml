# ExternalSecret for PostgreSQL app credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgresql-app-secret
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    secret:
      name: postgresql-app-secret
      creationPolicy: Owner
      deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/databases/postgresql-app
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/databases/postgresql-app
        property: password
