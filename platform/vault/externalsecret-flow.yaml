# ExternalSecret for Flow app secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flow-secrets
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    secret:
      name: flow-secrets
      creationPolicy: Owner
      deletionPolicy: Retain
  data:
    - secretKey: database-url
      remoteRef:
        key: secret/data/apps/flow
        property: database-url
    - secretKey: mongodb-url
      remoteRef:
        key: secret/data/apps/flow
        property: mongodb-url
    - secretKey: redis-url
      remoteRef:
        key: secret/data/apps/flow
        property: redis-url
