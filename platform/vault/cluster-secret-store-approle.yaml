# ClusterSecretStore using AppRole auth
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "http://openbao.vault.svc.cluster.local:8200"
      path: "secret"  # KV v2 mount path
      version: "v2"   # KV v2 secrets engine
      auth:
        appRole:
          roleId: "c0cb1648-b326-607b-33b7-0cc1500349c5"
          secretRef:
            name: openbao-approle
            namespace: vault
