# OpenBao Helm values - simplified for homelab
# Using HashiCorp Vault Helm chart with OpenBao image

server:
  image:
    repository: "ghcr.io/openbao/openbao"
    tag: "2.0.0"
    pullPolicy: IfNotPresent

  # Override the command to use bao instead of vault
  extraArgs: ""
  
  # Dev mode - single node, in-memory, auto-unsealed
  dev:
    enabled: true

  # Disable HA
  ha:
    enabled: false
    replicas: 1

  # Disable storage (dev mode uses in-memory)
  dataStorage:
    enabled: false
  auditStorage:
    enabled: false

  # Service
  service:
    enabled: true
    type: ClusterIP
    port: 8200
    targetPort: 8200

  # Resources
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # UI disabled in dev mode (not needed)
  ui:
    enabled: false

# Disable injector
injector:
  enabled: false

# Standalone config
standalone:
  enabled: true
