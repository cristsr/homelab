apiVersion: v1
kind: Secret
metadata:
  name: vault-bootstrap-secrets
  namespace: vault
type: Opaque
stringData:
  # Argocd
  argocd_github_pat: "DUMMY_GITHUB_PAT"
  argocd_repo_url: "https://github.com/cristsr/homelab"

  # DockerHub
  dockerhub_password: "DUMMY_DOCKERHUB_PASSWORD"

  # Infra
  cloudflare_api_token: "DUMMY_CLOUDFLARE_API_TOKEN"
  cloudflared_token: "DUMMY_CLOUDFLARE_TUNNEL_TOKEN"

  # Databases
  postgresql_username: "appuser"
  postgresql_password: "DUMMY_POSTGRES_PASSWORD"
  redis_username: "default"
  redis_password: "DUMMY_REDIS_PASSWORD"
  mongodb_username: "appuser"
  mongodb_password: "DUMMY_MONGODB_PASSWORD"
  qdrant_api_key: "DUMMY_QDRANT_API_KEY"

  # Devtools
  openmemory_openai_api_key: "DUMMY_OPENAI_API_KEY"
  sonarqube_password: "DUMMY_SONARQUBE_PASSWORD"

  # Monitoring
  grafana_username: "admin"
  grafana_password: "DUMMY_GRAFANA_PASSWORD"