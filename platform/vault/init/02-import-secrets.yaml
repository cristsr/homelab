apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-import-secrets
  namespace: vault
spec:
  template:
    spec:
      serviceAccountName: external-secrets-sa
      restartPolicy: OnFailure
      containers:
        - name: import
          image: ghcr.io/openbao/openbao:2.5.3
          command: ["/bin/sh", "-c"]
          env:
            - name: BAO_ADDR
              value: "http://openbao.vault.svc.cluster.local:8200"
          args:
            - |
              set -e

              echo "Waiting for OpenBao..."
              sleep 10

              # Get root token (assumes init already done)
              bao status >/dev/null 2>&1 || {
                echo "OpenBao not initialized, run openbao-init first"
                exit 1
              }

              # Login with Kubernetes auth
              BAO_SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              bao login -method=kubernetes role=external-secrets jwt="$BAO_SA_TOKEN" >/dev/null 2>&1 || {
                echo "Failed Kubernetes login, ensure init completed"
                exit 1
              }

              # Install kubectl and jq
              kubectl version --client >/dev/null 2>&1 || \
                curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && \
                chmod +x kubectl && mv kubectl /usr/local/bin/
              apk add --no-cache jq >/dev/null 2>&1 || true

              # Import bootstrap secrets to KV
              if kubectl get secret vault-bootstrap-secrets -n vault >/dev/null 2>&1; then
                echo "Importing bootstrap secrets to OpenBao..."

                # Get all keys from secret
                KEYS=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath='{.data}' | jq -r 'keys[]')

                for key in $KEYS; do
                  value=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath="{.data.$key}" | base64 -d)

                  # Skip DUMMY or REEMPLAZAR values
                  if [[ "$value" == DUMMY_* ]] || [[ "$value" == REEMPLAZAR_* ]]; then
                    echo "Skipping $key (placeholder value)"
                    continue
                  fi

                  # Map key to KV path
                  case "$key" in
                    argocd_github_pat)
                      ARGO_URL=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath='{.data.argocd_repo_url}' | base64 -d)
                      bao kv put secret/argocd username="x-access-token" github_pat="$value" url="$ARGO_URL"
                      echo "  secret/argocd -> github_pat, username, url"
                      ;;
                    dockerhub_password)
                      bao kv put secret/dockerhub password="$value"
                      echo "  secret/dockerhub -> password"
                      ;;
                    cloudflare_api_token)
                      bao kv put secret/infra/cloudflare api_token="$value"
                      echo "  secret/infra/cloudflare -> api_token"
                      ;;
                    cloudflared_token)
                      bao kv put secret/infra/cloudflared token="$value"
                      echo "  secret/infra/cloudflared -> token"
                      ;;
                    postgresql_username)
                      POSTGRES_PASSWORD=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath='{.data.postgresql_password}' | base64 -d)
                      bao kv put secret/databases/postgresql-app username="$value" password="$POSTGRES_PASSWORD"
                      echo "  secret/databases/postgresql-app -> username, password"
                      ;;
                    redis_username)
                      REDIS_PASSWORD=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath='{.data.redis_password}' | base64 -d)
                      bao kv put secret/databases/redis username="$value" redis-password="$REDIS_PASSWORD"
                      echo "  secret/databases/redis -> username, redis-password"
                      ;;
                    mongodb_username)
                      MONGODB_PASSWORD=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath='{.data.mongodb_password}' | base64 -d)
                      bao kv put secret/databases/mongodb-app username="$value" password="$MONGODB_PASSWORD"
                      echo "  secret/databases/mongodb-app -> username, password"
                      ;;
                    qdrant_api_key)
                      bao kv put secret/databases/qdrant api_key="$value"
                      echo "  secret/databases/qdrant -> api_key"
                      ;;
                    openmemory_openai_api_key)
                      bao kv put secret/devtools/openmemory OPENAI_API_KEY="$value"
                      echo "  secret/devtools/openmemory -> OPENAI_API_KEY"
                      ;;
                    sonarqube_password)
                      bao kv put secret/devtools/sonarqube password="$value"
                      echo "  secret/devtools/sonarqube -> password"
                      ;;
                    grafana_username)
                      GRAFANA_PASSWORD=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath='{.data.grafana_password}' | base64 -d)
                      bao kv put secret/monitoring/grafana username="$value" password="$GRAFANA_PASSWORD"
                      echo "  secret/monitoring/grafana -> username, password"
                      ;;
                  esac
                done

                # Compose flow app connection URLs from individual credentials
                PG_USER=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath='{.data.postgresql_username}' | base64 -d)
                PG_PASS=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath='{.data.postgresql_password}' | base64 -d)
                MONGO_USER=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath='{.data.mongodb_username}' | base64 -d)
                MONGO_PASS=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath='{.data.mongodb_password}' | base64 -d)
                REDIS_PASS=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath='{.data.redis_password}' | base64 -d)

                if [[ "$PG_PASS" != REEMPLAZAR_* && "$MONGO_PASS" != REEMPLAZAR_* && "$REDIS_PASS" != REEMPLAZAR_* ]]; then
                  bao kv put secret/apps/flow \
                    database-url="postgresql://${PG_USER}:${PG_PASS}@postgresql-rw.databases.svc.cluster.local:5432/homelab" \
                    mongodb-url="mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb-rs0.databases.svc.cluster.local:27017/homelab" \
                    redis-url="redis://default:${REDIS_PASS}@redis-master.databases.svc.cluster.local:6379"
                  echo "  secret/apps/flow -> database-url, mongodb-url, redis-url"
                fi

                echo "Bootstrap secrets imported"
              else
                echo "No vault-bootstrap-secrets found, skipping import"
              fi