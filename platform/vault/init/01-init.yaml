apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-init
  namespace: vault
spec:
  template:
    spec:
      serviceAccountName: external-secrets-sa
      restartPolicy: OnFailure
      containers:
        - name: init
          image: ghcr.io/openbao/openbao:2.5.3
          command: ["/bin/sh", "-c"]
          env:
            - name: BAO_ADDR
              value: "http://openbao.vault.svc.cluster.local:8200"
          args:
            - |
              set -e

              KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              KUBE_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              K8S="https://kubernetes.default.svc"

              k8s_secret_get() {
                curl -s --cacert "$KUBE_CA" \
                  -H "Authorization: Bearer $KUBE_TOKEN" \
                  "$K8S/api/v1/namespaces/vault/secrets/$1" 2>/dev/null
              }

              k8s_secret_create() {
                curl -sf --cacert "$KUBE_CA" \
                  -H "Authorization: Bearer $KUBE_TOKEN" \
                  -H "Content-Type: application/json" \
                  -X POST "$K8S/api/v1/namespaces/vault/secrets" \
                  -d "$1" > /dev/null
              }

              # Wait until OpenBao responds:
              #   exit 0 = unsealed, exit 2 = sealed/uninitialised, exit 1 = not yet up
              until bao status > /dev/null 2>&1; do
                [ $? -eq 1 ] || break
                echo "Waiting for OpenBao..."
                sleep 5
              done

              init_done=false
              if bao status -format=json 2>/dev/null | grep -q '"initialized": true'; then
                echo "Already initialised, checking root token"
                ROOT_SECRET=$(k8s_secret_get openbao-root-token 2>/dev/null)
                if echo "$ROOT_SECRET" | grep -q '"kind":"Secret"'; then
                  BAO_TOKEN=$(echo "$ROOT_SECRET" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p' | base64 -d)
                  echo "Root token recovered from existing secret"
                else
                  echo "Root token secret missing — re-initializing"
                  bao operator init -recovery-shares=1 -recovery-threshold=1 -format=json > /tmp/init.json
                  BAO_TOKEN=$(jq -r '.root_token' /tmp/init.json)
                  RECOVERY_KEY=$(jq -r '.recovery_keys_b64[0]' /tmp/init.json)
                  k8s_secret_create "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"openbao-recovery-key\",\"namespace\":\"vault\"},\"data\":{\"key\":\"$(printf '%s' "$RECOVERY_KEY" | base64 | tr -d '\n')\"}}"
                  echo "Recovery key saved"
                  k8s_secret_create "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"openbao-root-token\",\"namespace\":\"vault\"},\"data\":{\"token\":\"$(printf '%s' "$BAO_TOKEN" | base64 | tr -d '\n')\"}}"
                  echo "Root token saved"
                fi
                init_done=true
              fi

              if [ "$init_done" = false ]; then
                bao operator init -recovery-shares=1 -recovery-threshold=1 -format=json > /tmp/init.json
                BAO_TOKEN=$(jq -r '.root_token' /tmp/init.json)
                RECOVERY_KEY=$(jq -r '.recovery_keys_b64[0]' /tmp/init.json)
                k8s_secret_create "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"openbao-recovery-key\",\"namespace\":\"vault\"},\"data\":{\"key\":\"$(printf '%s' "$RECOVERY_KEY" | base64 | tr -d '\n')\"}}"
                echo "Recovery key saved"
                k8s_secret_create "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"openbao-root-token\",\"namespace\":\"vault\"},\"data\":{\"token\":\"$(printf '%s' "$BAO_TOKEN" | base64 | tr -d '\n')\"}}"
                echo "Root token saved"
              fi

              RECOVERY_KEY=""  # scrub

              bao login "$BAO_TOKEN" &>/dev/null

              bao secrets enable -path=secret kv-v2 2>/dev/null || true
              bao auth enable kubernetes 2>/dev/null || true
              bao write auth/kubernetes/config \
                kubernetes_host="$K8S" \
                kubernetes_ca_cert="$(cat "$KUBE_CA")" \
                token_reviewer_jwt="$KUBE_TOKEN"

              bao policy write external-secrets - << 'POLICY'
              path "secret/data/*"     { capabilities = ["read"] }
              path "secret/metadata/*" { capabilities = ["list", "read"] }
              POLICY

              bao write auth/kubernetes/role/external-secrets \
                bound_service_account_names=external-secrets-sa \
                bound_service_account_namespaces=vault \
                policies=external-secrets \
                ttl=24h

              bao policy write vault-sync-operator - << 'POLICY'
              path "secret/data/*"     { capabilities = ["create", "read", "update", "delete"] }
              path "secret/metadata/*" { capabilities = ["list", "read"] }
              POLICY

              bao write auth/kubernetes/role/vault-sync-operator \
                bound_service_account_names=vault-sync-operator-sa \
                bound_service_account_namespaces=vault \
                policies=vault-sync-operator \
                ttl=24h

              echo "OpenBao initialised successfully"
