apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-init
  namespace: vault
spec:
  template:
    spec:
      serviceAccountName: external-secrets-sa
      restartPolicy: OnFailure
      containers:
        - name: init
          image: ghcr.io/openbao/openbao:2.5.3
          command: ["/bin/sh", "-c"]
          env:
            - name: BAO_ADDR
              value: "http://openbao.vault.svc.cluster.local:8200"
          args:
            - |
              set -e

              # Wait until OpenBao responds:
              #   exit 0 = unsealed, exit 2 = sealed/uninitialised, exit 1 = not yet up
              until bao status > /dev/null 2>&1; do
                [ $? -eq 1 ] || break
                echo "Waiting for OpenBao..."
                sleep 5
              done

              # Idempotency: Static Seal auto-unseals on restart, so status 0 = already done
              if bao status -format=json 2>/dev/null | grep -q '"initialized": true'; then
                echo "Already initialised, skipping init"
                ROOT_TOKEN_EXISTS=$(kubectl get secret openbao-root-token -n vault --ignore-not-found -o name 2>/dev/null)
                if [ -n "$ROOT_TOKEN_EXISTS" ]; then
                  BAO_TOKEN=$(kubectl get secret openbao-root-token -n vault -o jsonpath='{.data.token}' 2>/dev/null | base64 -d)
                else
                  echo "Root token secret not found, re-initializing"
                  bao operator init -recovery-shares=1 -recovery-threshold=1 -format=json > /tmp/init.json
                  BAO_TOKEN=$(jq -r '.root_token' /tmp/init.json)
                  RECOVERY_KEY=$(jq -r '.recovery_keys_b64[0]' /tmp/init.json)
                  KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  KUBE_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  curl -sf --cacert "$KUBE_CA" \
                    -H "Authorization: Bearer $KUBE_TOKEN" \
                    -H "Content-Type: application/json" \
                    -X POST "https://kubernetes.default.svc/api/v1/namespaces/vault/secrets" \
                    -d "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"openbao-recovery-key\",\"namespace\":\"vault\"},\"data\":{\"key\":\"$(printf '%s' "$RECOVERY_KEY" | base64 | tr -d '\n')\"}}" \
                    > /dev/null
                  echo "Recovery key saved to openbao-recovery-key secret"
                  curl -sf --cacert "$KUBE_CA" \
                    -H "Authorization: Bearer $KUBE_TOKEN" \
                    -H "Content-Type: application/json" \
                    -X POST "https://kubernetes.default.svc/api/v1/namespaces/vault/secrets" \
                    -d "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"openbao-root-token\",\"namespace\":\"vault\"},\"data\":{\"token\":\"$(printf '%s' "$BAO_TOKEN" | base64 | tr -d '\n')\"}}" \
                    > /dev/null
                  echo "Root token saved to openbao-root-token secret (temporary)"
                fi
              else
                # First-time init
                bao operator init -recovery-shares=1 -recovery-threshold=1 -format=json > /tmp/init.json
                BAO_TOKEN=$(jq -r '.root_token' /tmp/init.json)
                RECOVERY_KEY=$(jq -r '.recovery_keys_b64[0]' /tmp/init.json)
                KUBE_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                KUBE_CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                curl -sf --cacert "$KUBE_CA" \
                  -H "Authorization: Bearer $KUBE_TOKEN" \
                  -H "Content-Type: application/json" \
                  -X POST "https://kubernetes.default.svc/api/v1/namespaces/vault/secrets" \
                  -d "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"openbao-recovery-key\",\"namespace\":\"vault\"},\"data\":{\"key\":\"$(printf '%s' "$RECOVERY_KEY" | base64 | tr -d '\n')\"}}" \
                  > /dev/null
                echo "Recovery key saved to openbao-recovery-key secret"
                curl -sf --cacert "$KUBE_CA" \
                  -H "Authorization: Bearer $BAO_TOKEN" \
                  -H "Content-Type: application/json" \
                  -X POST "https://kubernetes.default.svc/api/v1/namespaces/vault/secrets" \
                  -d "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"openbao-root-token\",\"namespace\":\"vault\"},\"data\":{\"token\":\"$(printf '%s' "$BAO_TOKEN" | base64 | tr -d '\n')\"}}" \
                  > /dev/null
                echo "Root token saved to openbao-root-token secret (temporary)"
              fi

              export BAO_TOKEN
              RECOVERY_KEY="" KUBE_TOKEN="" KUBE_CA=""  # scrub sensitive vars

              # Authenticate with root token for the remaining setup
              bao login "$BAO_TOKEN" &>/dev/null

              # Secrets engine (safe to rerun — errors if already enabled are ignored)
              bao secrets enable -path=secret kv-v2 2>/dev/null || true

              # Kubernetes auth (safe to rerun)
              bao auth enable kubernetes 2>/dev/null || true
              bao write auth/kubernetes/config \
                kubernetes_host="https://kubernetes.default.svc" \
                kubernetes_ca_cert="$(cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)" \
                token_reviewer_jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"

              # ESO: read-only on all secrets
              bao policy write external-secrets - << 'POLICY'
              path "secret/data/*"     { capabilities = ["read"] }
              path "secret/metadata/*" { capabilities = ["list", "read"] }
              POLICY

              bao write auth/kubernetes/role/external-secrets \
                bound_service_account_names=external-secrets-sa \
                bound_service_account_namespaces=vault \
                policies=external-secrets \
                ttl=24h

              # vault-sync-operator: full CRUD on secrets
              bao policy write vault-sync-operator - << 'POLICY'
              path "secret/data/*"     { capabilities = ["create", "read", "update", "delete"] }
              path "secret/metadata/*" { capabilities = ["list", "read"] }
              POLICY

              bao write auth/kubernetes/role/vault-sync-operator \
                bound_service_account_names=vault-sync-operator-sa \
                bound_service_account_namespaces=vault \
                policies=vault-sync-operator \
                ttl=24h

              echo "OpenBao initialised successfully"
