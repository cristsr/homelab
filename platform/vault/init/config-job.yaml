apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-init
  namespace: vault
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    spec:
      serviceAccountName: vault
      restartPolicy: OnFailure
      containers:
        - name: init
          image: ghcr.io/openbao/openbao:2.0.0
          command: ["/bin/sh", "-c"]
          env:
            - name: BAO_ADDR
              value: "http://openbao.vault.svc.cluster.local:8200"
          args:
            - |
              set -e

              echo "Waiting for OpenBao..."
              sleep 10

              # Check if already initialized
              STATUS=$(bao status 2>&1 || true)
              if echo "$STATUS" | grep -q "Initialized.*true"; then
                echo "OpenBao already initialized"
                exit 0
              fi

              # Initialize (dev mode - single key)
              echo "Initializing OpenBao..."
              bao operator init -key-shares=1 -key-threshold=1 -format=json > /tmp/init.json
              UNSEAL_KEY=$(jq -r '.unseal_keys_b64[0]' /tmp/init.json)
              ROOT_TOKEN=$(jq -r '.root_token' /tmp/init.json)

              # Save token for later use
              echo "$ROOT_TOKEN" > /tmp/bao-token

              # Unseal
              bao operator unseal $UNSEAL_KEY

              # Login
              export BAO_TOKEN=$ROOT_TOKEN

              # Enable KV v2
              bao secrets enable -path=secret kv-v2 || true

              # Enable Kubernetes auth
              bao auth enable kubernetes || true

              # Configure Kubernetes auth
              BAO_SA_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              BAO_CA_CERT=$(cat /var/run/secrets/kubernetes.io/serviceaccount/ca.crt)
              bao write auth/kubernetes/config \
                kubernetes_host="https://kubernetes.default.svc" \
                kubernetes_ca_cert="$BAO_CA_CERT" \
                token_reviewer_jwt="$BAO_SA_TOKEN"

              # Policy for external-secrets
              bao policy write external-secrets - <<EOF
              path "secret/data/*" {
                capabilities = ["read"]
              }
              path "secret/metadata/*" {
                capabilities = ["list", "read"]
              }
              EOF

              # Role for external-secrets
              bao write auth/kubernetes/role/external-secrets \
                bound_service_account_names=external-secrets-sa \
                bound_service_account_namespaces=external-secrets \
                policies=external-secrets \
                ttl=24h

              # Policy for vault-sync-operator
              bao policy write vault-sync-operator - <<EOF
              path "secret/data/*" {
                capabilities = ["create", "read", "update", "delete"]
              }
              path "secret/metadata/*" {
                capabilities = ["list", "read"]
              }
              EOF

              # Role for vault-sync-operator
              bao write auth/kubernetes/role/vault-sync-operator \
                bound_service_account_names=vault-sync-operator-sa \
                bound_service_account_namespaces=vault \
                policies=vault-sync-operator \
                ttl=24h

              # Install kubectl
              kubectl version --client >/dev/null 2>&1 || \
                curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && \
                chmod +x kubectl && mv kubectl /usr/local/bin/
              apk add --no-cache jq >/dev/null 2>&1 || true

              # Import bootstrap secrets to KV
              if kubectl get secret vault-bootstrap-secrets -n vault >/dev/null 2>&1; then
                echo "Importing bootstrap secrets to OpenBao..."

                # Get all keys from secret
                KEYS=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath='{.data}' | jq -r 'keys[]')

                for key in $KEYS; do
                  value=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath="{.data.$key}" | base64 -d)

                  # Skip DUMMY values
                  if [[ "$value" == DUMMY_* ]]; then
                    continue
                  fi

                  # Map key to KV path
                  case "$key" in
                    argocd_github_pat)
                      bao kv put secret/argocd github_pat="$value"
                      echo "  secret/argocd -> github_pat"
                      ;;
                    dockerhub_password)
                      bao kv put secret/dockerhub password="$value"
                      echo "  secret/dockerhub -> password"
                      ;;
                    cloudflare_api_token)
                      bao kv put secret/infra/cloudflare api_token="$value"
                      echo "  secret/infra/cloudflare -> api_token"
                      ;;
                    cloudflared_token)
                      bao kv put secret/infra/cloudflared token="$value"
                      echo "  secret/infra/cloudflared -> token"
                      ;;
                    postgresql_username)
                      POSTGRES_PASSWORD=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath='{.data.postgresql_password}' | base64 -d)
                      bao kv put secret/databases/postgresql-app username="$value" password="$POSTGRES_PASSWORD"
                      echo "  secret/databases/postgresql-app -> username, password"
                      ;;
                    redis_username)
                      REDIS_PASSWORD=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath='{.data.redis_password}' | base64 -d)
                      bao kv put secret/databases/redis username="$value" redis_password="$REDIS_PASSWORD"
                      echo "  secret/databases/redis -> username, redis_password"
                      ;;
                    mongodb_username)
                      MONGODB_PASSWORD=$(kubectl get secret vault-bootstrap-secrets -n vault -o jsonpath='{.data.mongodb_password}' | base64 -d)
                      bao kv put secret/databases/mongodb-app username="$value" password="$MONGODB_PASSWORD"
                      echo "  secret/databases/mongodb-app -> username, password"
                      ;;
                    qdrant_api_key)
                      bao kv put secret/databases/qdrant api_key="$value"
                      echo "  secret/databases/qdrant -> api_key"
                      ;;
                  esac
                done

                echo "Bootstrap secrets imported"
              else
                echo "No vault-bootstrap-secrets found, skipping import"
              fi

              echo "OpenBao initialized successfully"