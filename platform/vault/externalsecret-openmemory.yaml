# ExternalSecret for OpenMemory secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openmemory-secrets
  namespace: dev-tools
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openmemory-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: secret/data/dev-tools/openmemory
        property: OPENAI_API_KEY
