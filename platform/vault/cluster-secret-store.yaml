# ClusterSecretStore - points to OpenBao
# After OpenBao is initialized and Kubernetes auth is enabled,
# update the server URL and auth path accordingly

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "http://openbao.vault.svc.cluster.local:8200"
      path: "secret"  # KV v2 mount path
      version: "v2"   # KV v2 secrets engine
      auth:
        # Kubernetes service account auth
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets-sa"
            namespace: "external-secrets"
