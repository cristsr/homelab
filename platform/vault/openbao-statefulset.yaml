# REFERENCIA SOLAMENTE — NO DESPLEGAR DIRECTAMENTE
# OpenBao se gestiona vía Helm chart en gitops/apps/vault/openbao.yaml
# Este archivo es solo documentación histórica. No apuntar ninguna
# ArgoCD Application a platform/vault/ (raíz) o este archivo se desplegará
# creando un StatefulSet duplicado en conflicto con el chart de Helm.

apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: vault
  labels:
    app: openbao
spec:
  type: ClusterIP
  ports:
    - port: 8200
      targetPort: 8200
      name: http
  selector:
    app: openbao
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  namespace: vault
  labels:
    app: openbao
spec:
  serviceName: openbao
  replicas: 1
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
    spec:
      containers:
        - name: openbao
          image: ghcr.io/openbao/openbao:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8200
              name: http
          env:
            - name: BAO_ADDR
              value: "http://127.0.0.1:8200"
            - name: BAO_UI
              value: "true"
          command:
            - "/bin/bao"
            - "server"
            - "-config=/vault/config/config.hcl"
          volumeMounts:
            - name: config
              mountPath: /vault/config
            - name: data
              mountPath: /vault/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: openbao-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  namespace: vault
data:
  config.hcl: |
    ui = true

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = 1
    }

    storage "file" {
      path = "/vault/data"
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
automountServiceAccountToken: true
