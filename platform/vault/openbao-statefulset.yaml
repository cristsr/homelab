# OpenBao StatefulSet - simplified for homelab
# Dev mode - single node, in-memory, auto-unsealed

apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: vault
  labels:
    app: openbao
spec:
  type: ClusterIP
  ports:
    - port: 8200
      targetPort: 8200
      name: http
  selector:
    app: openbao
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  namespace: vault
  labels:
    app: openbao
spec:
  serviceName: openbao
  replicas: 1
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
    spec:
      containers:
        - name: openbao
          image: ghcr.io/openbao/openbao:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8200
              name: http
          env:
            - name: BAO_ADDR
              value: "http://127.0.0.1:8200"
            - name: BAO_DEV_ROOT_TOKEN_ID
              value: "root"  # Change in production!
          command:
            - "/bin/bao"
            - "server"
            - "-dev"
            - "-dev-listen-address=0.0.0.0:8200"
            - "-dev-root-token-id=${BAO_DEV_ROOT_TOKEN_ID}"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
automountServiceAccountToken: true
