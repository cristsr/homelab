# OpenBao Helm values - production mode

server:
  # Production mode
  dev:
    enabled: false

  # Standalone server (no HA)
  ha:
    enabled: false
    replicas: 1

  # Storage backend (local PVC for homelab)
  dataStorage:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi
  auditStorage:
    enabled: false

  # Listener config for UI
  extraArgs:
    - "-log-level=info"

  # Service
  service:
    enabled: true
    type: ClusterIP
    port: 8200
    targetPort: 8200

  # Resources
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # UI enabled for production
  ui:
    enabled: true

# Disable injector
injector:
  enabled: false
