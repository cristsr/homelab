apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-home
  namespace: networking
spec:
  secretName: wildcard-home-tls
  issuerRef:
    name: letsencrypt-prod-cloudflare-dns01
    kind: ClusterIssuer
  dnsNames:
    - "cristianpuenguenan.online"
    - "*.cristianpuenguenan.online"
  duration: 2160h     # 90 days
  renewBefore: 360h   # Renews 15 days before expiry
