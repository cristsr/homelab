# Real Let's Encrypt wildcard for private routes, trusted by any browser.
# DNS-01 doesn't require the subdomain to resolve publicly, so it stays
# unreachable outside the tailnet even though the certificate is real.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-internal-online
  namespace: networking
spec:
  secretName: wildcard-internal-online-tls
  issuerRef:
    name: letsencrypt-prod-cloudflare-dns01
    kind: ClusterIssuer
  dnsNames:
    - "internal.cristianpuenguenan.online"
    - "*.internal.cristianpuenguenan.online"
  duration: 2160h     # 90 days
  renewBefore: 360h   # renews 15 days before expiry
