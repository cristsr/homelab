# Wildcard real (Let's Encrypt, mismo ClusterIssuer que wildcard-home-tls)
# para las rutas privadas, en un subdominio de un dominio que ya es
# nuestro - reemplaza la CA propia de internal-tls.yaml (ver
# docs/DECISIONS.md, actualizacion de ADR-012). El DNS-01 no exige que
# `*.internal.cristianpuenguenan.online` resuelva publicamente: nunca se
# publica un registro A, asi que sigue sin ser alcanzable fuera del
# tailnet, igual que `.internal` hoy - pero el certificado lo confia
# cualquier navegador sin instalar nada.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-internal-online
  namespace: networking
spec:
  secretName: wildcard-internal-online-tls
  issuerRef:
    name: letsencrypt-prod-cloudflare-dns01
    kind: ClusterIssuer
  dnsNames:
    - "internal.cristianpuenguenan.online"
    - "*.internal.cristianpuenguenan.online"
  duration: 2160h     # 90 dias
  renewBefore: 360h   # Renueva 15 dias antes
