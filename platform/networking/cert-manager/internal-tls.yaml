# PKI para las rutas internas (*.cristianpuenguenan.internal). `.internal` es
# un TLD reservado - ninguna CA publica (Let's Encrypt incluida) puede emitir
# certificados para el, asi que el cluster firma las suyas. Mismo patron que
# platform/networking/hubble/pki/hubble-pki.yaml: Issuer selfSigned -> CA
# -> ClusterIssuer ca -> leaf. La CA raiz hay que confiarla a mano en cada
# dispositivo del tailnet (ver docs/OPERATIONS.md 11.5).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: internal-selfsigned
  namespace: networking
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-root-ca
  namespace: networking
spec:
  isCA: true
  commonName: Homelab Internal CA
  secretName: internal-root-ca
  duration: 87600h  # 10 años
  renewBefore: 720h  # 30 días antes de expirar
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: internal-selfsigned
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
spec:
  ca:
    secretName: internal-root-ca
---
# Un unico wildcard para las 11 rutas privadas de `main` y
# `agentgateway-mcp` (ambos Gateways viven en `networking`, requisito de
# certificateRefs en Gateway API). El redirect HTTP->HTTPS vive en
# httproute-redirect.yaml de cada Gateway.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-internal
  namespace: networking
spec:
  secretName: wildcard-internal-tls
  issuerRef:
    name: internal-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "cristianpuenguenan.internal"
    - "*.cristianpuenguenan.internal"
  duration: 8760h   # 1 año
  renewBefore: 2160h  # 90 días antes
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - digital signature
    - key encipherment
    - server auth
