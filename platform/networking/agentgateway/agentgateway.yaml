namespace: networking

gateway:
  className: agentgateway
  controller:
    replicas: 1
    service:
      # ClusterIP on purpose: the `main` Gateway terminates TLS and forwards
      # plain HTTP; the Agent Gateway controller doesn't support HTTPS itself.
      type: ClusterIP

metrics:
  enabled: true
  serviceMonitor:
    enabled: false

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi