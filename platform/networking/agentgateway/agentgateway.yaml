namespace: networking

gateway:
  className: agentgateway
  controller:
    replicas: 1
    service:
      # ClusterIP a proposito: TLS lo termina `main` (Cilium) y reenvia
      # en HTTP plano hacia este Service - ver ADR-012 (actualizacion) en
      # docs/DECISIONS.md. El controller de Agent Gateway tampoco soporta
      # HTTPS, asi que no tiene sentido exponerlo con IP externa propia.
      type: ClusterIP

metrics:
  enabled: true
  serviceMonitor:
    enabled: false

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi