apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-mcp
  namespace: networking
spec:
  gatewayClassName: agentgateway
  addresses:
    - type: IPAddress
      value: 192.168.122.250
  infrastructure:
    parametersRef:
      name: main
      group: agentgateway.dev
      kind: AgentgatewayParameters
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
