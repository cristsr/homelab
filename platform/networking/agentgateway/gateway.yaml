apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-mcp
  namespace: networking
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      name: main
      group: agentgateway.dev
      kind: AgentgatewayParameters
  listeners:
    # HTTP plano a proposito: el controller de Agent Gateway (v1.1.0) ignora
    # silenciosamente los listeners HTTPS (no crea el listener en status ni
    # el puerto en el Service) — ver ADR-012. Este listener ya no se expone
    # con IP externa (Service ClusterIP, agentgateway.yaml): el unico que lo
    # alcanza es el proxy interno de `main`, que termina TLS con la CA
    # interna y reenvia para aca (platform/networking/cilium-gateway/
    # httproute-agentgateway-proxy.yaml).
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
