apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-mcp
  namespace: networking
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      name: main
      group: agentgateway.dev
      kind: AgentgatewayParameters
  listeners:
    # Plain HTTP on purpose: the Agent Gateway controller silently ignores
    # HTTPS listeners. Only the internal `main` proxy reaches this listener,
    # after terminating TLS itself.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
