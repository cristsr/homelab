apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-mcp
  namespace: networking
spec:
  gatewayClassName: agentgateway
  addresses:
    - type: IPAddress
      value: 192.168.122.250
  infrastructure:
    parametersRef:
      name: main
      group: agentgateway.dev
      kind: AgentgatewayParameters
  listeners:
    # HTTP plano a proposito: el controller de Agent Gateway (v1.1.0) ignora
    # silenciosamente los listeners HTTPS (no crea el listener en status ni
    # el puerto en el Service) — ver ADR-012. Las rutas MCP sirven por el
    # tailnet privado, TLS terminado por Tailscale mismo (WireGuard).
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
