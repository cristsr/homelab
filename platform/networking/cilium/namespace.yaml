# The Cilium chart is configured to not manage this Namespace itself, so it
# must be created here. Needs privileged because spire-agent uses
# hostNetwork/hostPID/hostPath.
apiVersion: v1
kind: Namespace
metadata:
  name: cilium-spire
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
