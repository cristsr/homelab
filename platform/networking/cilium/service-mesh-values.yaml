authentication:
  enabled: true
  mutual:
    spire:
      enabled: true
      install:
        enabled: true
        # Lets namespace.yaml manage the Namespace and its PodSecurity labels
        # instead of the chart, since spire-agent/spire-server need privileged access.
        existingNamespace: true
        # Memory limits sized from 7-day peaks (no CPU limits); without them
        # these pods are BestEffort and Talos' OOM controller kills them first.
        agent:
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 192Mi
        server:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          dataStorage:
            enabled: true
          # The persistent volume's files are already owned by root:root, but
          # the chart's image runs as a non-root UID by default and fails to
          # write to them. Forcing root restores the existing ownership.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
