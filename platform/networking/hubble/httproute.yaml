apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble
  namespace: kube-system
spec:
  parentRefs:
    - name: main
      namespace: networking
      sectionName: https
    - name: main
      namespace: networking
      sectionName: https-online
  hostnames:
    - hubble.cristianpuenguenan.internal
    - hubble.internal.cristianpuenguenan.online
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80