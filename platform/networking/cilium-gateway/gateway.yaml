apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: networking
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.80.240
  listeners:
    # 80 queda exclusivamente para el redirect HTTP->HTTPS
    # (httproute-redirect.yaml); por eso solo admite rutas del namespace
    # `networking`. El contenido vive en el listener https.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: networking
    # Let's Encrypt real via DNS-01 (ver docs/DECISIONS.md, actualizacion
    # de ADR-012) - reemplaza la CA propia autofirmada. DNS-01 no exige
    # que el subdominio resuelva publicamente, asi que sigue sin ser
    # alcanzable fuera del tailnet, pero el certificado lo confia
    # cualquier navegador sin instalar nada.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.internal.cristianpuenguenan.online"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-internal-online-tls
      allowedRoutes:
        namespaces:
          from: All
