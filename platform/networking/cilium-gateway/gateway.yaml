apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: networking
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.80.240
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: networking
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.internal.cristianpuenguenan.online"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-internal-online-tls
      allowedRoutes:
        namespaces:
          from: All
