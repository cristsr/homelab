# Sin nodeSelector a proposito: el unico nodo del cluster es control-plane,
# y los ejemplos tipicos de esta policy lo excluyen - acá no aplica.
#
# "ens18" no es un nombre fragil: Proxmox asigna siempre el slot PCI 18 al
# primer (y unico) network_device de la VM (terraform/infra/proxmox.tf), y
# el nombrado predecible de Linux deriva "ensN" directo de ese slot PCI, no
# del orden de deteccion de drivers en el boot. Es estable ante destroy+apply
# mientras la VM siga con una sola interfaz de red.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab-lan
spec:
  interfaces:
    - "^ens18$"
  externalIPs: true
  loadBalancerIPs: true
