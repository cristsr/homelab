# Dos pools de 1 IP cada uno, cada uno atado a un Service especifico via
# serviceSelector (io.kubernetes.service.name/namespace son selectores
# especiales de metadata, no labels reales del Service).
#
# Necesario porque el controller de Agent Gateway NO traduce el
# `spec.addresses` del recurso Gateway a una peticion real de IP fija en el
# Service que genera (a diferencia del controller de Cilium, que si lo
# hace via la annotation io.cilium/lb-ipam-ips) - con un pool compartido sin
# selector, Cilium LB IPAM le daba la primera IP libre a lo primero que
# pedia sin especificar cual, pisando la IP que le correspondia al otro
# Gateway. Verificado contra el cluster real.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: cilium-gateway-main
spec:
  blocks:
    - cidr: "192.168.122.240/32"
  serviceSelector:
    matchLabels:
      "io.kubernetes.service.namespace": networking
      "io.kubernetes.service.name": cilium-gateway-main
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: agentgateway-mcp
spec:
  blocks:
    - cidr: "192.168.122.50/32"
  serviceSelector:
    matchLabels:
      "io.kubernetes.service.namespace": networking
      "io.kubernetes.service.name": agentgateway-mcp
