# One dedicated pool per Service instead of a shared pool, so Cilium's LB
# IPAM can't hand a Service the IP meant for another one.
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: cilium-gateway-main
spec:
  blocks:
    - cidr: "192.168.80.240/32"
  serviceSelector:
    matchLabels:
      "io.kubernetes.service.namespace": networking
      "io.kubernetes.service.name": cilium-gateway-main
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: private-dns
spec:
  blocks:
    - cidr: "192.168.80.253/32"
  serviceSelector:
    matchLabels:
      "io.kubernetes.service.namespace": networking
      "io.kubernetes.service.name": private-dns
