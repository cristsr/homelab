# HTTP->HTTPS redirect for `main`. No `hostnames` on purpose: any request on
# port 80 is redirected to 443.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-to-https
  namespace: networking
spec:
  parentRefs:
    - name: main
      namespace: networking
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
