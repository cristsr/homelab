apiVersion: v1
kind: Service
metadata:
  name: private-dns
  namespace: networking
spec:
  type: LoadBalancer
  selector:
    app: private-dns
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
