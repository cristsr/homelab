# Static A records for the cluster's private routes only; public services
# resolve via Cloudflare instead. `fallthrough` + `forward` keep this from
# becoming a black hole if it's ever used as a primary DNS server by mistake.
apiVersion: v1
kind: ConfigMap
metadata:
  name: private-dns-corefile
  namespace: networking
data:
  Corefile: |
    . {
        hosts {
            192.168.80.240 argocd.internal.cristianpuenguenan.online
            192.168.80.240 grafana.internal.cristianpuenguenan.online
            192.168.80.240 headlamp.internal.cristianpuenguenan.online
            192.168.80.240 hubble.internal.cristianpuenguenan.online
            192.168.80.240 sonarqube.internal.cristianpuenguenan.online
            192.168.80.240 mcp.internal.cristianpuenguenan.online
            192.168.80.240 hindsight-api.internal.cristianpuenguenan.online
            192.168.80.240 hindsight.internal.cristianpuenguenan.online
            192.168.80.240 sonarr.internal.cristianpuenguenan.online
            192.168.80.240 radarr.internal.cristianpuenguenan.online
            192.168.80.240 prowlarr.internal.cristianpuenguenan.online
            192.168.80.240 qbittorrent.internal.cristianpuenguenan.online
            192.168.80.240 bazarr.internal.cristianpuenguenan.online
            192.168.80.240 jellyfin.internal.cristianpuenguenan.online
            192.168.80.240 overseerr.internal.cristianpuenguenan.online
            192.168.80.240 heimdall.internal.cristianpuenguenan.online
            192.168.80.240 lidarr.internal.cristianpuenguenan.online
            192.168.80.240 chaptarr.internal.cristianpuenguenan.online
            192.168.80.240 kimai.internal.cristianpuenguenan.online
            192.168.80.240 firefly.internal.cristianpuenguenan.online
            192.168.80.240 n8n.internal.cristianpuenguenan.online
            192.168.80.240 forgejo.internal.cristianpuenguenan.online
            10.10.20.10 postgres.internal.cristianpuenguenan.online
            10.10.20.20 mongodb.internal.cristianpuenguenan.online
            10.10.20.40 redis.internal.cristianpuenguenan.online
            10.10.20.50 mysql.internal.cristianpuenguenan.online
            fallthrough
        }
        forward . 1.1.1.1 1.0.0.1
        cache 30
        errors
        log
    }
