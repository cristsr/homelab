# Registros A estaticos solo para las rutas privadas del cluster - todas
# entran por `main` (192.168.122.240), incluidas las de Agent Gateway, que
# se reenvian puertas adentro (ver docs/DECISIONS.md ADR-011 y ADR-012).
# portfolio/api no entran acá - son publicas, resuelven via el DNS real de
# Cloudflare. `fallthrough` + `forward` evitan que esto se convierta en un
# agujero negro si algo lo usa como DNS primario por error.
apiVersion: v1
kind: ConfigMap
metadata:
  name: private-dns-corefile
  namespace: networking
data:
  Corefile: |
    . {
        hosts {
            192.168.122.240 argocd.internal.cristianpuenguenan.online
            192.168.122.240 grafana.internal.cristianpuenguenan.online
            192.168.122.240 headlamp.internal.cristianpuenguenan.online
            192.168.122.240 hubble.internal.cristianpuenguenan.online
            192.168.122.240 longhorn.internal.cristianpuenguenan.online
            192.168.122.240 openbao.internal.cristianpuenguenan.online
            192.168.122.240 openmemory.internal.cristianpuenguenan.online
            192.168.122.240 sonarqube.internal.cristianpuenguenan.online
            192.168.122.240 agentgateway.internal.cristianpuenguenan.online
            192.168.122.240 mcp.internal.cristianpuenguenan.online
            192.168.122.240 openmemory-api.internal.cristianpuenguenan.online
            fallthrough
        }
        forward . 1.1.1.1 1.0.0.1
        cache 30
        errors
        log
    }
