# Static A records for the cluster's private routes only; public services
# resolve via Cloudflare instead. `fallthrough` + `forward` keep this from
# becoming a black hole if it's ever used as a primary DNS server by mistake.
apiVersion: v1
kind: ConfigMap
metadata:
  name: private-dns-corefile
  namespace: networking
data:
  Corefile: |
    . {
        hosts {
            192.168.80.240 argocd.internal.cristianpuenguenan.online
            192.168.80.240 grafana.internal.cristianpuenguenan.online
            192.168.80.240 headlamp.internal.cristianpuenguenan.online
            192.168.80.240 hubble.internal.cristianpuenguenan.online
            192.168.80.240 openmemory.internal.cristianpuenguenan.online
            192.168.80.240 sonarqube.internal.cristianpuenguenan.online
            192.168.80.240 agentgateway.internal.cristianpuenguenan.online
            192.168.80.240 mcp.internal.cristianpuenguenan.online
            192.168.80.240 openmemory-api.internal.cristianpuenguenan.online
            192.168.80.31 postgres.internal.cristianpuenguenan.online
            192.168.80.32 mongodb.internal.cristianpuenguenan.online
            192.168.80.33 qdrant.internal.cristianpuenguenan.online
            192.168.80.34 redis.internal.cristianpuenguenan.online
            fallthrough
        }
        forward . 1.1.1.1 1.0.0.1
        cache 30
        errors
        log
    }
