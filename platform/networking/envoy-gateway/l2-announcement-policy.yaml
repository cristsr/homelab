# No nodeSelector: the single cluster node is the control-plane. "ens18" is
# a stable interface name tied to the VM's PCI slot, not to driver load order.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: homelab-lan
spec:
  interfaces:
    - "^ens18$"
  externalIPs: true
  loadBalancerIPs: true
