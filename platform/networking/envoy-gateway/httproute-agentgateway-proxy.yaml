# Terminates TLS here (Agent Gateway ignores HTTPS listeners) and forwards
# plain HTTP; Agent Gateway does its own routing internally.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-mcp-proxy
  namespace: networking
spec:
  parentRefs:
    - name: main
      namespace: networking
      sectionName: https
  hostnames:
    - mcp.internal.cristianpuenguenan.online
    - agentgateway.internal.cristianpuenguenan.online
    - openmemory-api.internal.cristianpuenguenan.online
  rules:
    - backendRefs:
        - name: agentgateway-mcp
          port: 80
