# The only Gateway the Cloudflare Tunnel wildcard points to - only routes
# meant to be public should attach here. No spec.addresses on purpose:
# cloudflared reaches it via ClusterIP/internal DNS, so a <pending>
# LoadBalancer doesn't matter.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: networking
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: public
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
