openapi: 3.1.0
info:
  title: spec-0015 API
  version: "1.0.0"
  description: spec-0015, Auto-translate subtitles when an episode is imported. The HTTP surface of the relay service, which Sonarr and a daily CronJob call to start a run.
tags:
  - name: metadata
    description: Keeps Sonarr's cached metadata from blocking imports
  - name: subtitles
    description: Endpoints exposed by the relay service in the media namespace

paths:
  /subtitles/run:
    post:
      tags: [subtitles]
      operationId: runSubtitleCycle
      summary: Start a run that gives Spanish subtitles to the episodes that still lack them
      description: Called by Sonarr when it finishes importing or upgrading an episode, and once a day by a CronJob with no body. The worker answers at once and works in the background; a call that arrives during a run makes exactly one more run follow it.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SonarrWebhookPayload'
      responses:
        '202':
          description: The call was accepted; the run started now, or it will start as soon as the current run ends
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'

  /metadata/refresh:
    post:
      tags: [metadata]
      operationId: refreshSeriesMetadata
      summary: Make Sonarr re-read a series while a grabbed episode still has a TBA title
      description: Called by Sonarr on grab. Sonarr refuses to import a recently aired episode whose cached title is TBA, even after TheTVDB names it. The worker asks Sonarr to refresh the series every 5 minutes, up to 5 times, until the named episodes have a title or a file. Only one loop runs per series; a grab that arrives meanwhile joins it, and no refresh is requested while Sonarr already has one queued or running for that series. Any event other than a grab is ignored.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SonarrWebhookPayload'
      responses:
        '202':
          description: The call was accepted
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    description: started when no loop ran for the series, joined when one was running, ignored when the body is not a grab of a known series
                    enum: [started, joined, ignored]

  /healthz:
    get:
      tags: [subtitles]
      operationId: getWorkerHealth
      summary: Tell whether the worker is ready to take a call
      description: The readiness check KubeElasti waits on before it forwards a call it held while the worker was at zero replicas.
      responses:
        '200':
          description: The worker is listening and can take a run request

components:
  schemas:
    SonarrWebhookPayload:
      type: object
      description: The part of Sonarr's webhook body the worker reads. Any other field is ignored, and a body that is not valid JSON is ignored as a whole.
      properties:
        eventType:
          type: string
          description: Sonarr's name for the event that fired the webhook, for example the import-complete event
        episodes:
          type: array
          description: The episodes the event is about, so the worker can wait for Bazarr to know them
          items:
            $ref: '#/components/schemas/SonarrEpisode'
    SonarrEpisode:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          description: Sonarr's episode id, which is the id Bazarr uses for the same episode
    RunAccepted:
      type: object
      required: [state]
      properties:
        state:
          description: started when no run was active, queued when a run was active and one more will follow it
          enum: [started, queued]
